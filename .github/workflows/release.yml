# Builds all targets and attaches them to a GitHub Release.
# Triggered by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
#
# Reuses the same mise tasks as local dev + build.yml (single source of truth):
#   irgo assets -> templ + Tailwind CSS (gitignored, but embedded in builds)
#   build:desktop (macOS), build:desktop:linux, build:desktop:windows (native,
#   smoke-tested before packaging), build:ios:sim, env:setup:android+build:android

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # manual trigger for testing the release pipeline

permissions:
  contents: write

jobs:
  web:
    name: Web binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web binary
        working-directory: myapp
        run: |
          irgo assets
          go build -o build/myapp .
      - name: Package
        run: |
          cd myapp/build
          tar -czf myapp-web-${{ github.ref_name }}.tar.gz myapp
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: myapp/build/myapp-web-*.tar.gz

  linux-desktop:
    name: Linux desktop
    runs-on: ubuntu-22.04   # webkit2gtk-4.0 unavailable on 24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install OS packages
        working-directory: myapp
        run: irgo install-tools
      - name: Build Linux app
        working-directory: myapp
        run: irgo build desktop linux
      - name: Package
        run: |
          cd myapp/build/desktop/linux
          tar -czf myapp-linux-${{ github.ref_name }}.tar.gz myapp static
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: myapp/build/desktop/linux/myapp-linux-*.tar.gz

  macos-desktop:
    name: macOS desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build macOS app
        working-directory: myapp
        run: irgo build desktop
      - name: Package macOS app bundle
        run: |
          cd myapp/build/desktop/macos
          ditto -c -k --keepParent myapp.app myapp-macos-${{ github.ref_name }}.zip
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: myapp/build/desktop/macos/*.zip

  windows-desktop:
    name: Windows desktop (native build + smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Windows app (native)
        working-directory: myapp
        run: irgo build desktop windows
      - name: Smoke test (launch + assert alive)
        shell: pwsh
        run: |
          $dir = "myapp\build\desktop\windows"
          $exe = Join-Path $dir "myapp.exe"
          if (-not (Test-Path $exe)) { Write-Error "exe not found: $exe"; exit 1 }
          $out = Join-Path $dir "smoke.out.log"
          $err = Join-Path $dir "smoke.err.log"
          $p = Start-Process -FilePath $exe -WorkingDirectory $dir `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "::error::myapp.exe exited early (code $($p.ExitCode))"
            if (Test-Path $out) { Write-Host "--- stdout ---"; Get-Content $out }
            if (Test-Path $err) { Write-Host "--- stderr ---"; Get-Content $err }
            exit 1
          }
          Write-Host "Smoke test PASSED — myapp.exe still running (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force
      - name: Package Windows exe
        shell: pwsh
        run: |
          $dir = "myapp\build\desktop\windows"
          $zip = Join-Path $dir "myapp-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path (Join-Path $dir "myapp.exe"), (Join-Path $dir "static") -DestinationPath $zip -Force
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: myapp/build/desktop/windows/myapp-windows-*.zip

  ios:
    name: iOS framework + simulator app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build iOS framework + simulator app
        working-directory: myapp
        run: irgo build ios --sim
      - name: Package
        run: |
          cd myapp/build/ios
          ditto -c -k --keepParent Irgo.xcframework Irgo-${{ github.ref_name }}.zip
          ditto -c -k --keepParent DerivedData/Build/Products/Debug-iphonesimulator/Example.app Example-ios-simulator-${{ github.ref_name }}.zip
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: myapp/build/ios/*.zip

  android:
    name: Android framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Android SDK + NDK
        working-directory: myapp
        run: irgo install-tools android
      - name: Build Android AAR
        working-directory: myapp
        run: irgo build android
      - name: Package
        run: |
          cd myapp/build/android
          zip -r irgo-android-${{ github.ref_name }}.zip irgo.aar
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: myapp/build/android/irgo-android-*.zip
