# Builds all targets and attaches them to a GitHub Release.
# Triggered by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
#
# Reuses the same mise tasks as local dev + build.yml (single source of truth):
#   mise run build:assets  -> pinned Go tools + templ + CSS (all gitignored)
#   mise run build:desktop:linux|all, build:ios:sim

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-desktop:
    name: Linux desktop
    runs-on: ubuntu-22.04   # webkit2gtk-4.0 unavailable on 24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install OS packages + tools + generate templ + build CSS
        run: |
          mise run env:setup
          mise run build:assets
      - name: Build Linux app
        run: mise run build:desktop:linux
      - name: Package
        run: |
          cd myapp/build/desktop/linux
          tar -czf myapp-linux-${{ github.ref_name }}.tar.gz myapp static
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: myapp/build/desktop/linux/myapp-linux-*.tar.gz

  macos-desktop:
    name: macOS + Windows desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tools + generate templ + build CSS
        run: mise run build:assets
      - name: Build macOS + Windows apps (task auto-installs mingw-w64)
        run: mise run build:desktop:all
      - name: Package macOS app bundle
        run: |
          cd myapp/build/desktop/macos
          ditto -c -k --keepParent myapp.app myapp-macos-${{ github.ref_name }}.zip
      - name: Package Windows exe
        run: |
          cd myapp/build/desktop/windows
          zip -r myapp-windows-${{ github.ref_name }}.zip myapp.exe static
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            myapp/build/desktop/macos/*.zip
            myapp/build/desktop/windows/*.zip

  ios:
    name: iOS framework + simulator app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tools + generate templ + build CSS
        run: mise run build:assets
      - name: Build iOS framework + simulator app
        run: mise run build:ios:sim
      - name: Package
        run: |
          cd myapp/build/ios
          ditto -c -k --keepParent Irgo.xcframework Irgo-${{ github.ref_name }}.zip
          ditto -c -k --keepParent DerivedData/Build/Products/Debug-iphonesimulator/Example.app Example-ios-simulator-${{ github.ref_name }}.zip
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: myapp/build/ios/*.zip
