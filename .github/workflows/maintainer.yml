# Demo-repo checks that a normal irgo project must not have.
#
# build.yml and release.yml are scaffolded by `irgo ci` and committed
# unmodified — they are what every irgo project gets, and this repo exists
# partly to prove they work. Anything specific to maintaining this demo against
# the joeblew999/irgo fork lives here, so those files stay byte-identical to
# the template.
#
# Nothing installs the CLI: `go tool irgo` builds the version go.mod requires,
# through the replace directive that points at the fork.

name: maintainer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The fork keeps the upstream module path, so the public proxy cannot serve
  # it under joeblew999/irgo. Fetch it straight from GitHub.
  GOPRIVATE: github.com/joeblew999/*

jobs:
  regen:
    name: The app still matches `irgo new`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # This repo IS the CLI's output. If regenerating changes a tracked file,
      # something was hand-edited here instead of fixed in the template.
      - name: Regenerate and diff
        run: |
          go tool irgo new .
          rm -f Makefile dev.sh
          if ! git diff --quiet -- . ':!go.sum'; then
            echo "::error::regenerating changed tracked files — fix the template, not this repo"
            git diff --stat -- . ':!go.sum'
            git diff -- . ':!go.sum' | head -100
            exit 1
          fi
          echo "app matches irgo new output"

  toolchain:
    name: Android toolchain round-trip (install → doctor → build → uninstall)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go tool irgo install-tools android
      - run: go tool irgo doctor android
      - run: go tool irgo build android
      # Proves the uninstall is the exact inverse: the machine must come back
      # clean, or a provisioning bug hides behind whatever was left behind.
      - name: Uninstall and verify removal
        run: |
          go tool irgo uninstall-tools android --remove-jdk
          go tool irgo uninstall-tools --all
          for p in "${ANDROID_HOME:-$HOME/Library/Android/sdk}" "$HOME/.irgo" "$HOME/.android" "$HOME/.gradle"; do
            [ -e "$p" ] && { echo "::error::expected removed but exists: $p"; exit 1; }
          done
          echo "uninstall round-trip OK — machine clean"
