# Builds every target on each push: Go tests + web, native Linux/macOS/Windows
# desktop (Windows is smoke-run), iOS framework + simulator, and Android AAR
# (install → doctor → build → uninstall round-trip).
#
# No emulator job: booting one in CI is slow and fragile for little signal —
# the AAR build already proves the toolchain. Emulator runs are a local
# concern (`irgo run android`), and the CLI gates on the environment itself,
# failing fast where an emulator cannot run at all.
#
# Every job starts from the shared `setup` composite action
# (.github/actions/setup): checkout + mise + `mise run env:tools`, which
# installs the irgo CLI pinned by IRGO_REPLACE.
#
# Gotchas:
#   1. _templ.go + output.css are gitignored but embedded -> irgo build
#      regenerates them; steps that call go directly run `irgo assets` first
#   2. webview_go links webkit2gtk-4.0 -> ubuntu-22.04 (not 24.04)
#   3. iOS device/App Store builds need signing -> gated on IOS_TEAM_ID
#   4. never ship an exe that was never run -> Windows is smoke-tested

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (tests + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # This job runs go directly rather than `irgo build`, so it has to ask
      # for the generated-but-embedded assets itself.
      - name: Regenerate embedded assets
        working-directory: myapp
        run: irgo assets
      - name: Run Go tests
        working-directory: myapp
        run: go test ./...
      - name: Build web binary
        working-directory: myapp
        run: go build -o build/myapp .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: myapp/build/myapp
          if-no-files-found: error

  # Desktop — one matrix job, native build per OS. Linux needs OS packages
  # (webkit2gtk); Windows is smoke-run after build (never ship a never-run exe).
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            needs_os_pkgs: true
            cmd: irgo build desktop linux
            artifact: desktop-linux
            path: myapp/build/desktop/linux/
            smoke: false
          - name: macOS
            os: macos-latest
            needs_os_pkgs: false
            cmd: irgo build desktop
            artifact: desktop-macos
            path: myapp/build/desktop/macos/
            smoke: false
          - name: Windows
            os: windows-latest
            needs_os_pkgs: false
            cmd: irgo build desktop windows
            artifact: desktop-windows-native
            path: myapp/build/desktop/windows/
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install host packages (GTK/WebKit for the Linux webview)
        if: matrix.needs_os_pkgs
        working-directory: myapp
        run: irgo install-tools
      - name: Build desktop app
        working-directory: myapp
        run: ${{ matrix.cmd }}
      - name: Smoke test (launch + assert alive)
        if: matrix.smoke
        shell: pwsh
        run: |
          $dir = "myapp\build\desktop\windows"
          $exe = Join-Path $dir "myapp.exe"
          if (-not (Test-Path $exe)) { Write-Error "exe not found: $exe"; exit 1 }
          $out = Join-Path $dir "smoke.out.log"
          $err = Join-Path $dir "smoke.err.log"
          $p = Start-Process -FilePath $exe -WorkingDirectory $dir `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "::error::myapp.exe exited early (code $($p.ExitCode))"
            if (Test-Path $out) { Write-Host "--- stdout ---"; Get-Content $out }
            if (Test-Path $err) { Write-Host "--- stderr ---"; Get-Content $err }
            exit 1
          }
          Write-Host "Smoke test PASSED — myapp.exe still running (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  ios:
    name: iOS framework + simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build iOS framework + simulator app
        working-directory: myapp
        run: irgo build ios --sim
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            myapp/build/ios/Irgo.xcframework/
            myapp/build/ios/DerivedData/Build/Products/Debug-iphonesimulator/Example.app/
          if-no-files-found: error

  android:
    name: Android framework (install → doctor → build → uninstall round-trip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Android toolchain
        working-directory: myapp
        run: irgo install-tools android
      - name: Verify toolchain
        working-directory: myapp
        run: irgo doctor android
      - name: Build Android AAR
        working-directory: myapp
        run: irgo build android
      - uses: actions/upload-artifact@v4
        with:
          name: android-framework
          path: myapp/build/android/
          if-no-files-found: error
      # Proves the CLI's uninstall is the exact inverse: toolchain must be gone.
      - name: Round-trip — uninstall and verify removal
        run: |
          (cd myapp && irgo uninstall-tools android --remove-jdk)
          for p in "${ANDROID_HOME:-$HOME/Library/Android/sdk}" "$HOME/.irgo" "$HOME/.android" "$HOME/.gradle"; do
            [ -e "$p" ] && { echo "::error::expected removed but exists: $p"; exit 1; }
          done
          echo "uninstall round-trip OK — machine clean"

  check-ios-signing:
    name: Detect iOS signing secrets
    runs-on: ubuntu-latest
    outputs:
      has_ios_team: ${{ steps.detect.outputs.has_ios_team }}
    steps:
      - id: detect
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: echo "has_ios_team=${{ env.IOS_TEAM_ID != '' }}" >> "$GITHUB_OUTPUT"

  ios-device:
    name: iOS device (App Store) — requires signing secrets
    runs-on: macos-latest
    needs: [ios, check-ios-signing]
    if: needs.check-ios-signing.outputs.has_ios_team == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Signing: add a Distribution cert + provisioning profile to the runner
      # keychain (e.g. via apple-actions/import-codesign-certs) and set the
      # IOS_TEAM_ID secret. Without it this job is skipped.
      - name: Build iOS Release (device)
        working-directory: myapp
        run: irgo build ios --device --team ${{ secrets.IOS_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device
          path: myapp/build/ios/DerivedData-Release/Build/Products/Release-iphoneos/Example.app/
          if-no-files-found: error
