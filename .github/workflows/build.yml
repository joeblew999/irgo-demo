# Builds all targets: Go tests, Linux/macOS/Windows desktop, iOS.
#
# Critical gotchas handled here (verified against irgo + this repo):
#   1. _templ.go files are gitignored  -> must run `mise run build:templ` first
#   2. static/css/output.css is gitignored and EMBEDDED into apps
#      (static/embed.go)              -> must run `bun install && mise run css` first
#   3. webview_go links webkit2gtk-4.0 -> use ubuntu-22.04 (not 24.04)
#   4. iOS device/App Store builds need signing -> gated behind secrets.IOS_TEAM_ID

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned to go.mod to avoid @latest drift (irgo v0.3.1, templ v0.3.977)
env:
  IRGO_VERSION: v0.3.1
  TEMPL_VERSION: v0.3.977

jobs:
  check:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Go tools (pinned)
        run: |
          go install github.com/stukennedy/irgo/cmd/irgo@${{ env.IRGO_VERSION }}
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}
      - name: Generate templ (gitignored, required before compile)
        run: mise run build:templ
      - name: Run Go tests
        run: mise run check:test

  linux-desktop:
    name: Linux desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install GTK/WebKit deps (webkit2gtk-4.0 unavailable on 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install Go tools (pinned)
        run: |
          go install github.com/stukennedy/irgo/cmd/irgo@${{ env.IRGO_VERSION }}
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}
      - name: Generate templ + build CSS (both gitignored, embedded in app)
        run: |
          cd myapp && bun install
          mise run build:templ
          mise run css
      - name: Build Linux app
        run: mise run build:desktop:linux
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: myapp/build/desktop/linux/
          if-no-files-found: error

  macos-desktop:
    name: macOS + Windows desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Go tools (pinned)
        run: |
          go install github.com/stukennedy/irgo/cmd/irgo@${{ env.IRGO_VERSION }}
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}
      - name: Generate templ + build CSS
        run: |
          cd myapp && bun install
          mise run build:templ
          mise run css
      - name: Build macOS + Windows apps (task auto-installs mingw-w64 via brew)
        run: mise run build:desktop:all
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-windows
          path: |
            myapp/build/desktop/macos/
            myapp/build/desktop/windows/
          if-no-files-found: error

  ios:
    name: iOS framework + simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Go tools (pinned)
        run: |
          go install github.com/stukennedy/irgo/cmd/irgo@${{ env.IRGO_VERSION }}
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}
          go install golang.org/x/mobile/cmd/gomobile@latest
      - name: Generate templ + build CSS
        run: |
          cd myapp && bun install
          mise run build:templ
          mise run css
      - name: Build iOS framework + simulator app
        run: mise run build:ios:sim
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            myapp/build/ios/Irgo.xcframework/
            myapp/build/ios/DerivedData/Build/Products/Debug-iphonesimulator/Example.app/
          if-no-files-found: error

  check-ios-signing:
    name: Detect iOS signing secrets
    runs-on: ubuntu-latest
    outputs:
      has_ios_team: ${{ steps.detect.outputs.has_ios_team }}
    steps:
      - id: detect
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: echo "has_ios_team=${{ env.IOS_TEAM_ID != '' }}" >> "$GITHUB_OUTPUT"

  ios-device:
    name: iOS device (App Store) — requires signing secrets
    runs-on: macos-latest
    needs: [ios, check-ios-signing]
    if: needs.check-ios-signing.outputs.has_ios_team == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Go tools (pinned)
        run: |
          go install github.com/stukennedy/irgo/cmd/irgo@${{ env.IRGO_VERSION }}
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}
          go install golang.org/x/mobile/cmd/gomobile@latest
      - name: Generate templ + build CSS
        run: |
          cd myapp && bun install
          mise run build:templ
          mise run css
      # Signing: add a Distribution cert + provisioning profile to the runner
      # keychain (e.g. via apple-actions/import-codesign-certs) and set the
      # IOS_TEAM_ID secret. Without it this job is skipped.
      - name: Build iOS Release (device)
        run: |
          cd myapp
          irgo build ios
          xcodebuild -project ios/Example/Example.xcodeproj -scheme Example \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData-Release \
            -DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device
          path: myapp/build/ios/DerivedData-Release/Build/Products/Release-iphoneos/Example.app/
          if-no-files-found: error
