# Builds every target on each push: Go tests + web, native Linux/macOS/Windows
# desktop (Windows is smoke-run), iOS framework + simulator, Android AAR
# (install → doctor → build → uninstall round-trip), and an Android emulator
# run that proves the CLI's self-provisioning end to end.
#
# Every job starts from the shared `setup` composite action
# (.github/actions/setup): checkout + mise + `mise run build:assets`
# (gitignored templ/CSS are regenerated here).
#
# Gotchas:
#   1. _templ.go + output.css are gitignored but embedded -> build:assets
#   2. webview_go links webkit2gtk-4.0 -> ubuntu-22.04 (not 24.04)
#   3. iOS device/App Store builds need signing -> gated on IOS_TEAM_ID
#   4. never ship an exe that was never run -> Windows is smoke-tested

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (tests + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Go tests
        run: mise run check:test
      - name: Build web binary
        run: mise run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: myapp/build/myapp
          if-no-files-found: error

  # Desktop — one matrix job, native build per OS. Linux needs OS packages
  # (webkit2gtk); Windows is smoke-run after build (never ship a never-run exe).
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            needs_os_pkgs: true
            task: build:desktop:linux
            artifact: desktop-linux
            path: myapp/build/desktop/linux/
            smoke: false
          - name: macOS
            os: macos-latest
            needs_os_pkgs: false
            task: build:desktop
            artifact: desktop-macos
            path: myapp/build/desktop/macos/
            smoke: false
          - name: Windows
            os: windows-latest
            needs_os_pkgs: false
            task: build:desktop:windows
            artifact: desktop-windows-native
            path: myapp/build/desktop/windows/
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install OS packages
        if: matrix.needs_os_pkgs
        run: mise run env:setup
      - name: Build desktop app
        run: mise run ${{ matrix.task }}
      - name: Smoke test (launch + assert alive)
        if: matrix.smoke
        shell: pwsh
        run: |
          $dir = "myapp\build\desktop\windows"
          $exe = Join-Path $dir "myapp.exe"
          if (-not (Test-Path $exe)) { Write-Error "exe not found: $exe"; exit 1 }
          $out = Join-Path $dir "smoke.out.log"
          $err = Join-Path $dir "smoke.err.log"
          $p = Start-Process -FilePath $exe -WorkingDirectory $dir `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "::error::myapp.exe exited early (code $($p.ExitCode))"
            if (Test-Path $out) { Write-Host "--- stdout ---"; Get-Content $out }
            if (Test-Path $err) { Write-Host "--- stderr ---"; Get-Content $err }
            exit 1
          }
          Write-Host "Smoke test PASSED — myapp.exe still running (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  ios:
    name: iOS framework + simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build iOS framework + simulator app
        run: mise run build:ios:sim
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            myapp/build/ios/Irgo.xcframework/
            myapp/build/ios/DerivedData/Build/Products/Debug-iphonesimulator/Example.app/
          if-no-files-found: error

  android:
    name: Android framework (install → doctor → build → uninstall round-trip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Android toolchain (irgo install-tools android)
        run: mise run env:setup:android
      - name: Verify toolchain (irgo doctor android)
        run: mise run check:android
      - name: Build Android AAR
        run: mise run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: android-framework
          path: myapp/build/android/
          if-no-files-found: error
      # Proves the CLI's uninstall is the exact inverse: toolchain must be gone.
      - name: Round-trip — uninstall and verify removal
        run: |
          mise run env:uninstall:android
          for p in "${ANDROID_HOME:-$HOME/Library/Android/sdk}" "$HOME/.irgo" "$HOME/.android" "$HOME/.gradle"; do
            [ -e "$p" ] && { echo "::error::expected removed but exists: $p"; exit 1; }
          done
          echo "uninstall round-trip OK — machine clean"

  # RUNTIME proof for Android — and proof of the CLI's self-provisioning: NO
  # explicit toolchain/emulator install steps. On a bare runner, `irgo run
  # android --no-window` installs the JDK/SDK/NDK/emulator/AVD itself, builds
  # the APK, boots the headless emulator (KVM), installs and launches the app.
  android-emulator:
    name: Android emulator (self-provision + headless run + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, install + launch on headless emulator (CLI self-provisions)
        run: mise run run:android:headless
      - name: Verify toolchain (irgo doctor android)
        run: mise run check:android
      - name: Smoke test — assert app process alive
        run: |
          ADB="$HOME/Android/Sdk/platform-tools/adb"
          PID=""
          for i in $(seq 1 60); do
            PID="$($ADB shell pidof com.irgo.example 2>/dev/null | tr -d ' \r')"
            [ -n "$PID" ] && break
            sleep 2
          done
          if [ -z "$PID" ]; then
            echo "::error::app process not running on emulator"
            $ADB shell dumpsys activity activities 2>/dev/null | grep -iE "mResumedActivity|irgo" | head -5 || true
            exit 1
          fi
          echo "Smoke test PASSED — com.irgo.example running (pid $PID)"
      - name: Capture screenshot
        run: |
          ADB="$HOME/Android/Sdk/platform-tools/adb"
          $ADB exec-out screencap -p > android-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke
          path: android-smoke.png
          if-no-files-found: error

  check-ios-signing:
    name: Detect iOS signing secrets
    runs-on: ubuntu-latest
    outputs:
      has_ios_team: ${{ steps.detect.outputs.has_ios_team }}
    steps:
      - id: detect
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: echo "has_ios_team=${{ env.IOS_TEAM_ID != '' }}" >> "$GITHUB_OUTPUT"

  ios-device:
    name: iOS device (App Store) — requires signing secrets
    runs-on: macos-latest
    needs: [ios, check-ios-signing]
    if: needs.check-ios-signing.outputs.has_ios_team == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Signing: add a Distribution cert + provisioning profile to the runner
      # keychain (e.g. via apple-actions/import-codesign-certs) and set the
      # IOS_TEAM_ID secret. Without it this job is skipped.
      - name: Build iOS Release (device)
        run: |
          cd myapp
          irgo build ios
          xcodebuild -project ios/Example/Example.xcodeproj -scheme Example \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData-Release \
            -DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device
          path: myapp/build/ios/DerivedData-Release/Build/Products/Release-iphoneos/Example.app/
          if-no-files-found: error
