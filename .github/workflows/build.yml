# Builds all targets: Go tests, Linux/macOS/Windows desktop, iOS.
#
# Tooling and gitignored-but-embedded artifacts are handled by mise tasks
# (single source of truth, shared with local dev):
#   - `mise run build:assets` installs pinned Go tools (depends env:tools)
#     then generates templ + builds CSS
#   - `mise run build:desktop:linux|all`, `build:ios:sim` do the builds
#
# Gotchas handled by those tasks / this file:
#   1. _templ.go + output.css are gitignored but required/embedded -> build:assets
#   2. webview_go links webkit2gtk-4.0 -> use ubuntu-22.04 (not 24.04)
#   3. iOS device/App Store builds need signing -> gated behind IOS_TEAM_ID secret

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tools + generate templ + build CSS
        run: mise run build:assets
      - name: Run Go tests
        run: mise run check:test
      - name: Build web binary
        run: mise run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: myapp/build/myapp
          if-no-files-found: error

  linux-desktop:
    name: Linux desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install OS packages + tools + generate templ + build CSS
        run: |
          mise run env:setup
          mise run build:assets
      - name: Build Linux app
        run: mise run build:desktop:linux
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: myapp/build/desktop/linux/
          if-no-files-found: error

  macos-desktop:
    name: macOS + Windows desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tools + generate templ + build CSS
        run: mise run build:assets
      - name: Build macOS + Windows apps (task auto-installs mingw-w64 via brew)
        run: mise run build:desktop:all
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-windows
          path: |
            myapp/build/desktop/macos/
            myapp/build/desktop/windows/
          if-no-files-found: error

  # Windows is cross-compiled above, but a cross-compiled exe has never been
  # RUN. This job builds natively on a real Windows runner and smoke-tests the
  # app: launch, wait, assert the process is still alive (catches WebView2 init
  # failures, missing DLLs, CGO linking, and static-dir resolution), then kill.
  windows-desktop:
    name: Windows desktop (native build + smoke run)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tools + generate templ + build CSS
        run: mise run build:assets
      - name: Diagnose toolchain (PATH / GOBIN / tools)
        shell: bash
        run: |
          echo "=== go ==="; go version 2>&1 || echo "go MISSING at step level"
          echo "=== go env ==="; go env GOBIN GOPATH 2>&1
          echo "=== GOBIN contents ==="; ls "$(go env GOBIN)" 2>&1 | head -20
          echo "=== tools ==="; for t in go templ irgo air gomobile; do printf '%-8s ' "$t"; command -v "$t" 2>/dev/null || echo "MISSING"; done
          echo "=== PATH (first 8) ==="; printf '%s\n' "$PATH" | tr ':' '\n' | head -8
          echo "=== Windows Path ==="; printf '%s\n' "$Path" | tr ';' '\n' | head -8
      - name: Diagnose mise task env
        run: mise run diag:env
      - name: Build Windows app (native)
        run: mise run build:desktop:windows
      - name: Smoke test (launch + assert alive)
        shell: pwsh
        run: |
          $dir = "myapp\build\desktop\windows"
          $exe = Join-Path $dir "myapp.exe"
          if (-not (Test-Path $exe)) { Write-Error "exe not found: $exe"; exit 1 }
          $out = Join-Path $dir "smoke.out.log"
          $err = Join-Path $dir "smoke.err.log"
          Write-Host "Launching $exe ..."
          $p = Start-Process -FilePath $exe -WorkingDirectory $dir `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "::error::myapp.exe exited early (code $($p.ExitCode))"
            if (Test-Path $out) { Write-Host "--- stdout ---"; Get-Content $out }
            if (Test-Path $err) { Write-Host "--- stderr ---"; Get-Content $err }
            exit 1
          }
          Write-Host "Smoke test PASSED — myapp.exe still running (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force
          if (Test-Path $out) { Write-Host "--- stdout ---"; Get-Content $out }
          if (Test-Path $err) { Write-Host "--- stderr ---"; Get-Content $err }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-native
          path: myapp/build/desktop/windows/
          if-no-files-found: error

  ios:
    name: iOS framework + simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tools + generate templ + build CSS
        run: mise run build:assets
      - name: Build iOS framework + simulator app
        run: mise run build:ios:sim
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            myapp/build/ios/Irgo.xcframework/
            myapp/build/ios/DerivedData/Build/Products/Debug-iphonesimulator/Example.app/
          if-no-files-found: error

  android:
    name: Android framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tools + generate templ + build CSS
        run: mise run build:assets
      - name: Install Android SDK + NDK
        run: mise run env:setup:android
      - name: Build Android AAR
        run: mise run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: android-framework
          path: myapp/build/android/
          if-no-files-found: error

  check-ios-signing:
    name: Detect iOS signing secrets
    runs-on: ubuntu-latest
    outputs:
      has_ios_team: ${{ steps.detect.outputs.has_ios_team }}
    steps:
      - id: detect
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: echo "has_ios_team=${{ env.IOS_TEAM_ID != '' }}" >> "$GITHUB_OUTPUT"

  ios-device:
    name: iOS device (App Store) — requires signing secrets
    runs-on: macos-latest
    needs: [ios, check-ios-signing]
    if: needs.check-ios-signing.outputs.has_ios_team == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tools + generate templ + build CSS
        run: mise run build:assets
      # Signing: add a Distribution cert + provisioning profile to the runner
      # keychain (e.g. via apple-actions/import-codesign-certs) and set the
      # IOS_TEAM_ID secret. Without it this job is skipped.
      - name: Build iOS Release (device)
        run: |
          cd myapp
          irgo build ios
          xcodebuild -project ios/Example/Example.xcodeproj -scheme Example \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData-Release \
            -DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device
          path: myapp/build/ios/DerivedData-Release/Build/Products/Release-iphoneos/Example.app/
          if-no-files-found: error
