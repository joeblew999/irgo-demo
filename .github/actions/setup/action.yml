# Shared job preamble for the build/release workflows: provision the mise
# toolchain, install the irgo CLI pinned by IRGO_REPLACE, and publish mise's
# env so later steps can call `irgo` directly.
#
# Builds regenerate the gitignored-but-embedded assets (templ + Tailwind CSS)
# themselves, so there is no assets step here — only jobs that bypass `irgo
# build` (plain go test/build) run `irgo assets` explicitly.
#
# NOTE: GitHub resolves local composite actions BEFORE any checkout runs, so
# every job must `uses: actions/checkout@v4` as its FIRST step, then this one.
name: setup
description: Provision the mise toolchain and regenerate build assets (templ + CSS)
inputs:
  github_token:
    description: Token for jdx/mise-action
    required: true
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
      with:
        github_token: ${{ inputs.github_token }}
    - name: Install the irgo CLI pinned by IRGO_REPLACE
      shell: bash
      run: mise run env:tools
    # Hand mise's whole env to the job so steps can call `irgo`/`go` directly
    # instead of routing everything through `mise run`. This carries GOPRIVATE
    # (without it, direct steps resolve the fork via proxy.golang.org, which
    # 404s until it indexes a freshly pushed tag) and GOBIN, where env:tools
    # `go install`s the irgo CLI — not otherwise on a runner's PATH.
    # PATH is excluded: GITHUB_PATH takes one directory per line, not a full
    # PATH string, and GOBIN is the only entry that matters here.
    - name: Export mise env to the job
      shell: bash
      run: |
        mise env --json | jq -r 'to_entries[] | select(.key != "PATH") | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
        mise env --json | jq -r '.GOBIN // empty' >> "$GITHUB_PATH"
    # No mobile-scaffold step: `irgo build`/`irgo run` scaffold ios/Example and
    # android/Example from the CLI's embedded templates themselves (missing-only,
    # idempotent). The `irgo new mobile` command that used to do it is gone.
