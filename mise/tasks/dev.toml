fi
# Self-heal stale go.work (see build:ios)
if [ -f go.work ]; then
  stale=0
  in_use=0
  while IFS= read -r line; do
    case "$line" in
      "use (") in_use=1 ;;
      ")") in_use=0 ;;
      "."|"") ;;
      *)
        if [ "$in_use" = "1" ]; then
          p=$(printf '%s' "$line" | tr -d '[:space:]')
          [ -d "$p" ] || { echo "go.work references missing dir: $p"; stale=1; }
        fi
        ;;
    esac
  done < go.work
  if [ "$stale" = "1" ]; then
    echo "Removing stale go.work (irgo regenerates it on next build)..."
    rm -f go.work go.work.sum
  fi
fi
irgo build ios
# Release build for physical devices. Signing comes from the Xcode project or
# pass a team via extra args, e.g.:
#   mise run build:ios:prod -- -DEVELOPMENT_TEAM=ABCDE12345
xcodebuild -project ios/Example/Example.xcodeproj -scheme Example \
  -configuration Release -destination 'generic/platform=iOS' \
  -derivedDataPath build/ios/DerivedData-Release build
"""

["build:android"]
description = "Build Android framework (gomobile bind → build/android/irgo.aar) — requires Android SDK + NDK"
dir = "{{config_root}}/myapp"
run = """
if ! command -v gomobile >/dev/null 2>&1; then
  echo "gomobile not found — run 'mise run env:setup' first"
  exit 1
fi
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
# Force our pinned NDK r26 (see env:setup:android). CI runners pre-set
# ANDROID_NDK_HOME to their own NDK (e.g. r27) that gomobile rejects with
# "unsupported API version 16" — so we override unconditionally, no default.
export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
if [ ! -d "$ANDROID_NDK_HOME" ]; then
  echo "Android NDK not found at $ANDROID_NDK_HOME — run 'mise run env:setup:android' first" >&2
  exit 1
fi
# Self-heal stale go.work (see build:ios)
if [ -f go.work ]; then
  stale=0
  in_use=0
  while IFS= read -r line; do
    case "$line" in
      "use (") in_use=1 ;;
      ")") in_use=0 ;;
      "."|"") ;;
      *)
        if [ "$in_use" = "1" ]; then
          p=$(printf '%s' "$line" | tr -d '[:space:]')
          [ -d "$p" ] || { echo "go.work references missing dir: $p"; stale=1; }
        fi
        ;;
    esac
  done < go.work
  if [ "$stale" = "1" ]; then
    echo "Removing stale go.work (irgo regenerates it on next build)..."
    rm -f go.work go.work.sum
  fi
fi
irgo templ
# irgo's mobile setup creates go.work + installs gomobile/gobind from source.
# Its built-in bind defaults to API 16, which modern NDKs (r26/r27: 21..3x)
# reject with "unsupported API version 16" — so we ignore that failure and run
# the real bind ourselves with the API level the NDK actually supports.
irgo build android || true
gomobile bind -target android -androidapi 21 -o build/android/irgo.aar ./mobile
"""

["build:mobile"]
description = "Build all mobile frameworks (iOS + Android) — the `irgo build all` equivalent"
dir = "{{config_root}}/myapp"
depends = ["build:ios", "build:android"]
run = "echo 'iOS + Android frameworks built'"

["run:android"]
description = "Build + launch Android app on emulator (needs android/Example + emulator)"
dir = "{{config_root}}/myapp"
# build:android produces build/android/irgo.aar (with the API-21 gomobile
# workaround — irgo's built-in bind defaults to API 16 and fails on NDK r26).
depends = ["build:android"]
run = """
if [ ! -d android/Example ]; then
  echo "android/Example not found — copy it from the irgo repo (see README)" >&2
  exit 1
fi
if [ ! -f build/android/irgo.aar ]; then
  echo "build/android/irgo.aar missing — run 'mise run build:android' first" >&2
  exit 1
fi
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
export PATH="$ANDROID_HOME/platform-tools:$PATH"
# Gradle needs a real JDK 17 (macOS /usr/bin/java is a stub). Detect in order:
#   1) an existing JAVA_HOME, 2) macOS java_home (finds any installed JDK 17,
#      e.g. Temurin), 3) the brew openjdk@17 formula path.
if [ -z "$JAVA_HOME" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
  if [ -x /usr/libexec/java_home ] && JH="$(/usr/libexec/java_home -v 17 2>/dev/null)" && [ -n "$JH" ] && [ -x "$JH/bin/java" ]; then
    export JAVA_HOME="$JH"
  elif BP="$(brew --prefix openjdk@17 2>/dev/null)" && [ -d "$BP/libexec/openjdk.jdk/Contents/Home" ]; then
    export JAVA_HOME="$BP/libexec/openjdk.jdk/Contents/Home"
  fi
fi
if [ -z "$JAVA_HOME" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
  echo "No JDK 17 found — run 'mise run env:setup:android' first" >&2
  exit 1
fi
export PATH="$JAVA_HOME/bin:$PATH"
echo "Using JDK: $JAVA_HOME"
# Boot the emulator if not already running
if ! command -v adb >/dev/null 2>&1 || ! adb get-state >/dev/null 2>&1; then
  EMU="$ANDROID_HOME/emulator/emulator"
  if [ ! -x "$EMU" ]; then
    echo "emulator not installed — run 'mise run env:setup:emulator' first" >&2
    exit 1
  fi
  echo "Booting emulator (AVD: irgo)..."
  "$EMU" -avd irgo -no-snapshot -no-audio -no-boot-anim &
  adb wait-for-device
  until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]')" = "1" ]; do
    sleep 2
  done
fi
# irgo's own `run android` stops here (its internal bind dies on API 16), so we
# finish what it would do: wire the AAR into the Example project, gradle build,
# install, and launch.
echo "Copying AAR into android/Example/app/libs..."
mkdir -p android/Example/app/libs
cp build/android/irgo.aar android/Example/app/libs/irgo.aar
echo "Building Android app (gradle assembleDebug)..."
./android/Example/gradlew -p android/Example assembleDebug
APK=android/Example/app/build/outputs/apk/debug/app-debug.apk
if [ ! -f "$APK" ]; then
  echo "built APK not found at $APK" >&2
  exit 1
fi
echo "Installing on emulator..."
adb install -r "$APK"
echo "Launching app..."
adb shell am start -n com.irgo.example/com.irgo.example.MainActivity
echo "App running on Android!"
"""
