# mise/tasks/dev.toml — irgo-demo day-to-day commands.
# mise auto-discovers .toml task files here (a default task dir), so no
# `[task_config] includes` is needed in mise.toml.
# All tasks run inside myapp/ where the project lives.
#
# Cross-platform: run `mise run env:setup` once per machine — it installs
# per-platform deps: brew (macOS), apt (Linux), MSYS2 pacman (Windows).
# Windows devs: these run scripts are POSIX shell — use Git Bash or MSYS2
# (not PowerShell/cmd).

["env:tools"]
description = "Install pinned Go tools (irgo/templ/air/gomobile) — versions match go.mod, idempotent"
dir = "{{config_root}}/myapp"
run = """
# Pinned to go.mod to avoid @latest drift: the irgo CLI must match the go.mod
# irgo version, and the templ generator must match the templ library version.
#
# irgo comes from the joeblew999/irgo fork (see go.mod `replace`). The fork
# keeps the upstream module path, so `go install github.com/joeblew999/irgo/...`
# would fail — build the CLI from a local checkout instead (set IRGO_FORK_DIR
# to point at one), falling back to the released CLI otherwise.
IRGO_FORK_DIR="${IRGO_FORK_DIR:-$HOME/workspace/go/src/github.com/joeblew999/irgo}"
if ! command -v irgo >/dev/null 2>&1; then
  if [ -d "$IRGO_FORK_DIR" ]; then
    echo "Installing irgo from fork ($IRGO_FORK_DIR)..."
    (cd "$IRGO_FORK_DIR" && go install ./cmd/irgo) || go install github.com/stukennedy/irgo/cmd/irgo@v0.3.1
  else
    echo "irgo fork not found at $IRGO_FORK_DIR — installing released CLI (v0.3.1). Set IRGO_FORK_DIR to use the fork." >&2
    go install github.com/stukennedy/irgo/cmd/irgo@v0.3.1
  fi
fi
for entry in \
  "templ|github.com/a-h/templ/cmd/templ@v0.3.977" \
  "air|github.com/air-verse/air@latest" \
  "gomobile|golang.org/x/mobile/cmd/gomobile@latest"; do
  name="${entry%%|*}"; pkg="${entry#*|}"
  if ! command -v "$name" >/dev/null 2>&1; then
    echo "Installing $name (go install)..."
    go install "$pkg" || echo "  ! failed to install $name"
  else
    echo "$name: already installed"
  fi
done
"""

["env:setup"]
description = "One-time: install all dev deps for this platform (Go tools + OS packages)"
depends = ["env:tools"]
dir = "{{config_root}}/myapp"
run = """
# OS-level packages, per platform (Go tools come from env:tools)
case "$(uname -s)" in
  Darwin)
    for pkg in entr mingw-w64; do
      if ! brew list --versions "$pkg" >/dev/null 2>&1; then
        echo "Installing $pkg via brew..."
        brew install "$pkg"
      fi
    done
    ;;
  Linux)
    # Debian/Ubuntu packages: entr (hot reload) + GTK3/WebKit2GTK 4.0
    # (desktop builds). Idempotent — skips if already installed.
    if command -v apt-get >/dev/null 2>&1; then
      if ! command -v entr >/dev/null 2>&1 || ! pkg-config --exists webkit2gtk-4.0 2>/dev/null; then
        echo "Installing OS packages via apt (entr, GTK3, WebKit2GTK 4.0)..."
        sudo apt-get update
        sudo apt-get install -y entr libgtk-3-dev libwebkit2gtk-4.0-dev
      else
        echo "Linux OS packages already installed"
      fi
    else
      echo "Linux: not apt-based — install entr, libgtk-3-dev, libwebkit2gtk-4.0-dev manually"
    fi
    ;;
  MINGW*|MSYS*|CYGWIN*)
    # MSYS2: install the mingw-w64 toolchain (C/C++ compiler for CGO desktop
    # builds). Idempotent (pacman --needed). Falls back to guidance otherwise.
    if command -v pacman >/dev/null 2>&1; then
      echo "Installing mingw-w64 toolchain via pacman..."
      pacman -S --noconfirm --needed mingw-w64-x86_64-gcc
    else
      echo "Windows: install MSYS2 (https://www.msys2.org) with the mingw-w64-x86_64 toolchain."
    fi
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    ;;
esac

# Initialize gomobile (no-op on macOS for iOS; needs Android NDK for android)
command -v gomobile >/dev/null 2>&1 && gomobile init || true
"""

["env:uninstall"]
description = "Remove everything 'env:setup' installs (Go tools + OS packages) — the exact inverse"
dir = "{{config_root}}/myapp"
run = """
gobin="$(go env GOBIN 2>/dev/null || echo "$(go env GOPATH)/bin")"
echo "Removing Go-installed tools from $gobin..."
for tool in irgo templ air gomobile gobind; do
  if [ -f "$gobin/$tool" ]; then
    echo "  removing $tool"
    rm -f "$gobin/$tool"
  fi
done

# Remove the temp x/mobile clone and local go.work created by irgo mobile builds
rm -rf "${TMPDIR:-/tmp}/golang-mobile" 2>/dev/null || true
rm -f go.work go.work.sum

case "$(uname -s)" in
  Darwin)
    echo "Removing brew packages (entr, mingw-w64)..."
    brew uninstall --formula mingw-w64 2>/dev/null || echo "  mingw-w64 not installed or already removed"
    brew uninstall --formula entr 2>/dev/null || echo "  entr not installed or already removed"
    brew autoremove 2>/dev/null || true
    ;;
  Linux)
    echo "Removing Linux OS packages (entr, GTK3, WebKit2GTK 4.0)..."
    sudo apt-get remove -y entr libgtk-3-dev libwebkit2gtk-4.0-dev 2>/dev/null || true
    ;;
  MINGW*|MSYS*|CYGWIN*)
    if command -v pacman >/dev/null 2>&1; then
      echo "Removing mingw-w64 toolchain via pacman..."
      pacman -R --noconfirm mingw-w64-x86_64-gcc 2>/dev/null || true
    else
      echo "Windows: remove MSYS2/mingw packages via pacman."
    fi
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    ;;
esac
"""

["env:setup:android"]
description = "Install Android SDK + NDK for Android builds (JDK + cmdline-tools + sdkmanager) — idempotent, cross-platform"
dir = "{{config_root}}/myapp"
run = """
set -e
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"

# --- JDK 17 (needed by sdkmanager + gradle; the example's Gradle 8.2/AGP 8.2
# doesn't run on JDK 21+). Cross-platform detection in order:
#   1) existing JAVA_HOME, 2) java on PATH, 3) macOS java_home (Temurin),
#   4) brew openjdk@17 (macOS), 5) common install dirs on Linux/Windows.
# If none is found we print platform-specific install instructions (auto
# installing a JDK needs sudo/winget and is left to the developer).
if [ -z "$JAVA_HOME" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
  if [ -x /usr/libexec/java_home ] && JH="$(/usr/libexec/java_home -v 17 2>/dev/null)" && [ -n "$JH" ] && [ -x "$JH/bin/java" ]; then
    export JAVA_HOME="$JH"
  elif [ "$(uname -s)" = "Darwin" ]; then
    if ! brew list --versions openjdk@17 >/dev/null 2>&1; then
      echo "Installing openjdk@17 via brew (required by sdkmanager + gradle)..."
      brew install openjdk@17
    fi
    export JAVA_HOME="$(brew --prefix openjdk@17)/libexec/openjdk.jdk/Contents/Home"
  elif [ "$(uname -s)" = "Linux" ]; then
    for d in /usr/lib/jvm/java-17-* /usr/lib/jvm/temurin-17* /usr/lib/jvm/msopenjdk-17*; do
      [ -x "$d/bin/java" ] && export JAVA_HOME="$d" && break
    done
  fi
fi
if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then
  export PATH="$JAVA_HOME/bin:$PATH"
  echo "Using JDK: $JAVA_HOME"
elif ! java -version >/dev/null 2>&1; then
  case "$(uname -s)" in
    Darwin)  echo "No JDK 17 — run 'brew install openjdk@17' (or install Temurin)." >&2 ;;
    Linux)   echo "No JDK 17 — run 'sudo apt install openjdk-17-jdk' (Debian/Ubuntu) or install Temurin." >&2 ;;
    MINGW*|MSYS*|CYGWIN*) echo "No JDK 17 — run 'winget install EclipseAdoptium.Temurin.17.JDK' or set JAVA_HOME." >&2 ;;
    *)       echo "No JDK 17 — install Temurin 17 and set JAVA_HOME." >&2 ;;
  esac
  exit 1
else
  echo "Using java from PATH (JAVA_HOME not set)."
fi

# --- cmdline-tools / sdkmanager (cross-platform). Install the official Google
# zip into $ANDROID_HOME/cmdline-tools/latest when no sdkmanager exists — this
# works on macOS/Linux/Windows without brew, and keeps cmdline-tools under
# $ANDROID_HOME so avdmanager/sdkmanager resolve against the right SDK root.
install_cmdline_tools() {
  local os ver url tmp
  case "$(uname -s)" in
    Darwin) os="mac" ;;
    Linux)  os="linux" ;;
    MINGW*|MSYS*|CYGWIN*) os="win" ;;
    *) echo "Unsupported OS for cmdline-tools download: $(uname -s)" >&2; return 1 ;;
  esac
  ver="${ANDROID_CMDLINE_TOOLS_VERSION:-11076708}"
  url="https://dl.google.com/android/repository/commandlinetools-${os}-${ver}_latest.zip"
  tmp="$(mktemp -d)"
  echo "Downloading Android cmdline-tools ($os, r$ver) from $url ..."
  curl -fsSL "$url" -o "$tmp/cmdtools.zip" || { echo "Download failed: $url" >&2; rm -rf "$tmp"; return 1; }
  mkdir -p "$ANDROID_HOME/cmdline-tools"
  unzip -q -o "$tmp/cmdtools.zip" -d "$tmp/extract" || { echo "unzip failed — install 'unzip' and retry" >&2; rm -rf "$tmp"; return 1; }
  rm -rf "$ANDROID_HOME/cmdline-tools/latest"
  mv "$tmp/extract/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
  rm -rf "$tmp"
  echo "Installed cmdline-tools at $ANDROID_HOME/cmdline-tools/latest"
}

SDKM="$(command -v sdkmanager 2>/dev/null || true)"
for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
         /opt/homebrew/share/android-commandlinetools/cmdline-tools/latest/bin/sdkmanager \
         /usr/local/share/android-commandlinetools/cmdline-tools/latest/bin/sdkmanager; do
  [ -z "$SDKM" ] && [ -x "$p" ] && SDKM="$p"
done
if [ -z "$SDKM" ]; then
  echo "sdkmanager not found — installing Android cmdline-tools into $ANDROID_HOME..."
  install_cmdline_tools
  [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ] && SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
fi
if [ -z "$SDKM" ]; then
  echo "Failed to locate sdkmanager. Install Android cmdline-tools manually or point ANDROID_HOME at an SDK that has them." >&2
  exit 1
fi
echo "Using sdkmanager: $SDKM"

# --- Install SDK components (sdkmanager is idempotent — skips what's installed)
mkdir -p "$ANDROID_HOME"
echo "Accepting Android SDK licenses..."
yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
echo "Installing Android SDK components (platform-tools, platforms, build-tools, NDK)..."
"$SDKM" --sdk_root="$ANDROID_HOME" \
  "platform-tools" \
  "platforms;android-34" \
  "platforms;android-35" \
  "build-tools;35.0.0" \
  "ndk;26.3.11579264"
# Note: android-34 is needed by the example app (compileSdk 34); android-35
# is a fallback for gomobile bind's platform lookup.

# Pin the NDK explicitly. NDK r26 is required: gomobile defaults to API 16
# and NDK r27+ dropped support below API 21 ("unsupported API version 16").
export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
if [ -d "$ANDROID_NDK_HOME" ]; then
  echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
  command -v gomobile >/dev/null 2>&1 && gomobile init 2>&1 | tail -3 || true
else
  echo "NDK not found at $ANDROID_NDK_HOME — Android build may fail." >&2
  exit 1
fi
echo "Android toolchain ready: $ANDROID_HOME"
"""

["env:setup:emulator"]
description = "Install Android emulator + system image + create AVD (local dev only, for run:android) — idempotent"
dir = "{{config_root}}/myapp"
run = """
set -e
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"

# sdkmanager/avdmanager are Java tools: make sure a JDK is available (same
# detection as env:setup:android — each task is its own process, so it does
# not inherit the other task's JAVA_HOME).
if [ -z "$JAVA_HOME" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
  if [ -x /usr/libexec/java_home ] && JH="$(/usr/libexec/java_home -v 17 2>/dev/null)" && [ -n "$JH" ] && [ -x "$JH/bin/java" ]; then
    export JAVA_HOME="$JH"
  elif [ "$(uname -s)" = "Darwin" ] && [ -d "$(brew --prefix openjdk@17)/libexec/openjdk.jdk/Contents/Home" ]; then
    export JAVA_HOME="$(brew --prefix openjdk@17)/libexec/openjdk.jdk/Contents/Home"
  elif [ "$(uname -s)" = "Linux" ]; then
    for d in /usr/lib/jvm/java-17-* /usr/lib/jvm/temurin-17* /usr/lib/jvm/msopenjdk-17*; do
      [ -x "$d/bin/java" ] && export JAVA_HOME="$d" && break
    done
  fi
fi
if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then
  export PATH="$JAVA_HOME/bin:$PATH"
fi
if ! java -version >/dev/null 2>&1; then
  echo "No JDK 17 found — run 'mise run env:setup:android' first or set JAVA_HOME (see its error for platform install commands)." >&2
  exit 1
fi

# Locate tools: prefer the SDK's own cmdline-tools so the AVD is created
# against the right SDK root (the brew `command -v` shims point at the cask's
# own root and produce broken AVDs with <build> placeholders).
SDKM="$(command -v sdkmanager 2>/dev/null || true)"
AVDMGR="$(command -v avdmanager 2>/dev/null || true)"
for p in "$ANDROID_HOME/cmdline-tools/latest/bin" \
         /opt/homebrew/share/android-commandlinetools/cmdline-tools/latest/bin \
         /usr/local/share/android-commandlinetools/cmdline-tools/latest/bin; do
  [ -z "$SDKM" ] && [ -x "$p/sdkmanager" ] && SDKM="$p/sdkmanager"
  [ -z "$AVDMGR" ] && [ -x "$p/avdmanager" ] && AVDMGR="$p/avdmanager"
done
if [ -z "$SDKM" ] || [ -z "$AVDMGR" ]; then
  echo "sdkmanager/avdmanager not found — run 'mise run env:setup:android' first." >&2
  exit 1
fi
echo "Using sdkmanager: $SDKM"
echo "Using avdmanager: $AVDMGR"

# Pick the system-image ABI for this machine: arm64 on Apple Silicon,
# x86_64 everywhere else (Intel Mac, Windows, Linux).
case "$(uname -s)-$(uname -m)" in
  Darwin-arm64) ABI="arm64-v8a" ;;
  *) ABI="x86_64" ;;
esac
SYSIMG="system-images;android-35;google_apis;$ABI"
echo "System image: $SYSIMG"

# Install emulator + platform-tools + system image (large download). Idempotent.
echo "Installing Android emulator + system image (large download)..."
"$SDKM" --sdk_root="$ANDROID_HOME" "emulator" "platform-tools" "$SYSIMG"

# Create the AVD if missing (idempotent). --device can fail when the bundled
# devices.xml lacks the requested profile, so use the default device profile.
# 'echo no' declines a custom hardware profile prompt.
if [ ! -d "$HOME/.android/avd/irgo.avd" ] || ! "$AVDMGR" list avd 2>/dev/null | grep -q "Name: irgo"; then
  echo "Creating AVD 'irgo' ($SYSIMG)..."
  echo no | "$AVDMGR" create avd -n irgo -k "$SYSIMG" --force
  # Normalize any <build> placeholders avdmanager may have written for name/id.
  if [ -f "$HOME/.android/avd/irgo.avd/config.ini" ]; then
    sed -i.bak -e 's/^avd.id=<build>$/avd.id=irgo/' -e 's/^avd.name=<build>$/avd.name=irgo/' \
      "$HOME/.android/avd/irgo.avd/config.ini" && rm -f "$HOME/.android/avd/irgo.avd/config.ini.bak"
  fi
fi
"$AVDMGR" list avd 2>/dev/null | grep -A1 "Name: irgo" | head -2
echo "Emulator ready — boot with: $ANDROID_HOME/emulator/emulator -avd irgo"
"""

["env:uninstall:android"]
description = "Remove everything env:setup:android/emulator installs + runtime residue — the exact inverse, self-contained"
dir = "{{config_root}}/myapp"
run = """
# --- Mobile Go tools (gomobile/gobind) installed by env:tools ---
gobin="$(go env GOBIN 2>/dev/null || echo "$(go env GOPATH)/bin")"
for tool in gomobile gobind; do
  if [ -f "$gobin/$tool" ]; then
    echo "Removing $tool from $gobin"
    rm -f "$gobin/$tool"
  fi
done
# Temp x/mobile clone + go.work created by irgo mobile builds. Use $TMPDIR:
# on macOS that is /var/folders/..., not /tmp.
rm -rf "${TMPDIR:-/tmp}/golang-mobile" 2>/dev/null || true
rm -rf "/tmp/golang-mobile" 2>/dev/null || true
rm -f go.work go.work.sum 2>/dev/null || true

# --- JDK / cmdline-tools installed via brew (macOS) ---
case "$(uname -s)" in
  Darwin)
    echo "Removing JDK (openjdk@17 formula and/or temurin cask)..."
    brew uninstall --formula openjdk@17 2>/dev/null || echo "  openjdk@17 not installed or already removed"
    brew uninstall --cask temurin@17 2>/dev/null || echo "  temurin@17 not installed or already removed"
    echo "Removing android-commandlinetools cask..."
    brew uninstall --cask android-commandlinetools 2>/dev/null || echo "  android-commandlinetools not installed or already removed"
    # Emulator preferences + temp residue (macOS paths)
    rm -f "$HOME/Library/Preferences/com.android.Emulator.plist" 2>/dev/null || true
    rm -rf "$HOME/Library/Caches/TemporaryItems/avd" 2>/dev/null || true
    ;;
  Linux)
    echo "Linux: remove Android cmdline-tools via your package manager (or delete \\$ANDROID_HOME)." >&2
    ;;
  MINGW*|MSYS*|CYGWIN*)
    echo "Windows: remove Android cmdline-tools via your package manager (or delete \\$ANDROID_HOME)." >&2
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    ;;
esac

# --- Runtime residue the emulator/gradle leave behind ---
echo "Removing ~/.android (AVDs, adb keys, emulator state)..."
rm -rf "$HOME/.android" 2>/dev/null || true
echo "Removing ~/.gradle (caches from Android builds)..."
rm -rf "$HOME/.gradle" 2>/dev/null || true

# --- SDK directory (only if it's the default location we manage; leave a
# dev's own custom SDK alone) ---
sdk="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
if [ -n "$ANDROID_HOME" ] && [ "$sdk" != "$HOME/Library/Android/sdk" ]; then
  echo "ANDROID_HOME is custom ($sdk) — leaving it in place. Remove manually if desired."
else
  echo "Removing SDK directory (SDK, NDK, emulator, system images): $sdk"
  rm -rf "$sdk" 2>/dev/null || true
  rmdir "$HOME/Library/Android" 2>/dev/null || true   # empty parent
fi
echo "Android tooling removed."
"""

["serve:dev"]
description = "Start irgo dev server (hot reload) — requires entr (brew install entr)"
dir = "{{config_root}}/myapp"
run = "irgo dev"

["serve"]
description = "Run web server without file watching (no entr needed — pure mise)"
dir = "{{config_root}}/myapp"
run = "irgo serve"

["css"]
description = "Rebuild Tailwind CSS (input.css → output.css)"
dir = "{{config_root}}/myapp"
run = "bun run css"

["css:watch"]
description = "Watch Tailwind CSS sources"
dir = "{{config_root}}/myapp"
run = "bun run css:watch"

["build:templ"]
description = "Generate _templ.go from *.templ templates"
dir = "{{config_root}}/myapp"
run = "irgo templ"

["build:assets"]
description = "Generate templ + build Tailwind CSS (both gitignored but embedded — run before any build)"
depends = ["env:tools"]
dir = "{{config_root}}/myapp"
run = """
set -e
bun install
# git-bash on Windows strips the Windows Path var, so native tools spawned by
# native tools (irgo -> templ) fail. Bash CAN run native tools directly, so use
# `templ generate` via its absolute path there. irgo templ elsewhere.
case "$(uname -s)" in
  MINGW*|MSYS*|CYGWIN*)
    TEMPL="$(command -v templ)"
    "$TEMPL" generate
    ;;
  *)
    irgo templ
    ;;
esac
bun run css
"""

["check:test"]
description = "Run Go tests"
dir = "{{config_root}}/myapp"
run = "go test ./..."

["build:web"]
description = "Build web server binary"
dir = "{{config_root}}/myapp"
run = "go build -o build/myapp ."

["build:desktop"]
description = "Build desktop app for the current platform (auto-detects OS)"
dir = "{{config_root}}/myapp"
run = """
case "$(uname -s)" in
  Darwin)
    echo "Detected macOS — building macOS app"
    irgo build desktop darwin
    ;;
  Linux)
    echo "Detected Linux — building Linux app"
    irgo build desktop linux
    ;;
  MINGW*|MSYS*|CYGWIN*)
    echo "Detected Windows — building Windows app"
    irgo build desktop windows
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    exit 1
    ;;
esac
"""

["build:desktop:windows"]
description = "Build Windows desktop app (native on Windows; macOS cross-compiles via mingw-w64)"
dir = "{{config_root}}/myapp"
run = """
# Fail loudly: mise does not always inject set -e, and a silent go build
# failure previously let the task pass without producing an exe.
set -e
case "$(uname -s)" in
  Darwin)
    # macOS: brew provides the mingw-w64 cross-compiler.
    if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
      echo "Installing mingw-w64 via brew (Windows cross-compiler)..."
      brew install mingw-w64
    fi
    GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \\
      CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \\
      irgo build desktop windows
    ;;
  MINGW*|MSYS*|CYGWIN*)
    # Windows native. git-bash strips the Windows Path var, so native tools
    # spawned by native tools (irgo -> go/templ/g++) fail exec.LookPath. Bash
    # itself CAN run native tools, so build directly with absolute paths and
    # point CC/CXX at the absolute gcc/g++ to avoid any LookPath.
    echo "Detected Windows — building natively (direct toolchain)"
    GO="$(command -v go)"
    TEMPL="$(command -v templ)"
    GCC="$(command -v gcc)"
    GXX="$(command -v g++)"
    "$TEMPL" generate
    mkdir -p build/desktop/windows
    CGO_ENABLED=1 CC="$GCC" CXX="$GXX" "$GO" build -tags desktop -ldflags "-H windowsgui" \\
      -o build/desktop/windows/myapp.exe .
    if [ -d static ]; then
      rm -rf build/desktop/windows/static
      cp -r static build/desktop/windows/static
    fi
    echo "Windows app built: build/desktop/windows/myapp.exe"
    ;;
  *)
    echo "Windows desktop build unsupported from $(uname -s)" >&2
    exit 1
    ;;
esac
"""

["build:desktop:linux"]
description = "Build Linux desktop app (native on Linux only — needs GTK/WebKit, not cross-compilable from macOS)"
dir = "{{config_root}}/myapp"
run = """
case "$(uname -s)" in
  Linux)
    echo "Detected Linux — building Linux app natively"
    irgo build desktop linux
    ;;
  *)
    echo "Linux desktop builds need GTK3 + WebKit2GTK and can't be cross-compiled from $(uname -s)." >&2
    echo "Build natively on a Linux machine/CI, or use a Docker image with:" >&2
    echo "  libgtk-3-dev libwebkit2gtk-4.0-dev golang" >&2
    exit 1
    ;;
esac
"""

["build:desktop:all"]
description = "Build all desktop apps the current environment supports (macOS → mac + windows)"
dir = "{{config_root}}/myapp"
run = """
case "$(uname -s)" in
  Darwin)
    echo "Detected macOS — building macOS + Windows apps"
    irgo build desktop darwin
    if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
      echo "Installing mingw-w64 via brew (Windows cross-compiler)..."
      brew install mingw-w64
    fi
    GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \
      CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
      irgo build desktop windows
    ;;
  Linux)
    echo "Detected Linux — building Linux app"
    irgo build desktop linux
    ;;
  MINGW*|MSYS*|CYGWIN*)
    echo "Detected Windows — building Windows app"
    irgo build desktop windows
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    exit 1
    ;;
esac
"""

["build:ios"]
description = "Build iOS framework (gomobile bind → build/ios/Irgo.xcframework) — requires Xcode"
dir = "{{config_root}}/myapp"
run = """
if ! command -v gomobile >/dev/null 2>&1; then
  echo "gomobile not found — run 'mise run env:setup' first"
  exit 1
fi
# Self-heal stale go.work: it references a temp x/mobile clone that macOS may
# have cleaned up. If so, remove it so irgo regenerates it (idempotent).
if [ -f go.work ]; then
  stale=0
  in_use=0
  while IFS= read -r line; do
    case "$line" in
      "use (") in_use=1 ;;
      ")") in_use=0 ;;
      "."|"") ;;
      *)
        if [ "$in_use" = "1" ]; then
          p=$(printf '%s' "$line" | tr -d '[:space:]')
          [ -d "$p" ] || { echo "go.work references missing dir: $p"; stale=1; }
        fi
        ;;
    esac
  done < go.work
  if [ "$stale" = "1" ]; then
    echo "Removing stale go.work (irgo regenerates it on next build)..."
    rm -f go.work go.work.sum
  fi
fi
irgo build ios
"""

