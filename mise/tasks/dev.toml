# mise/tasks/dev.toml — MAINTAINER TOOLING ONLY.
#
# Nothing here is needed to use irgo. A developer needs the irgo CLI and
# nothing else: it builds, runs, provisions its own toolchains and host
# packages, generates assets, and reports what the machine can do.
#
#   irgo doctor    what this host can and cannot build
#   irgo help      every command
#
# These tasks exist for whoever maintains THIS demo repo against the
# joeblew999/irgo fork:
#
#   env:tools   install the CLI version pinned by IRGO_REPLACE (mise.toml),
#               so the repo and the CLI that generated it stay in step
#   cli:bump    move the pin: tag the fork, update IRGO_REPLACE, regenerate
#               myapp/, and verify — all of it, or none of it
#   cli:regen   regenerate myapp/ from the pinned CLI
#   cli:verify  fail if the pin and myapp/go.mod disagree (CI runs this)

["env:tools"]
description = "Install the irgo CLI (fork) + irgo install-tools (templ pinned to go.mod, air, gomobile) — idempotent"
dir = "{{config_root}}"
run = """
# Pinned to go.mod to avoid @latest drift: the irgo CLI must match the go.mod
# irgo version, and the templ generator must match the templ library version.
#
# irgo comes from the joeblew999/irgo fork (see go.mod `replace`). The fork
# keeps the upstream module path, so `go install github.com/joeblew999/irgo/...`
# would fail — build the CLI from a checkout instead: a local one when present
# (IRGO_FORK_DIR), else clone the pinned fork tag so CI and fresh dev machines
# get the same fixed CLI (the released v0.3.1 is broken for mobile).
IRGO_FORK_DIR="${IRGO_FORK_DIR:-$HOME/workspace/go/src/github.com/joeblew999/irgo}"
# The fork version comes from IRGO_REPLACE in mise.toml — the same value
# `irgo new` writes into myapp/go.mod, so the CLI and the generated app can
# never disagree. Reading it back out of go.mod (as this used to) made the
# generated file the source of truth for its own generator, which meant
# regenerating myapp/ destroyed the pin.
IRGO_FORK_TAG="${IRGO_FORK_TAG:-${IRGO_REPLACE##* }}"
# Reinstall whenever the pin moves, not just when irgo is absent. Checking only
# `command -v irgo` meant a machine that already had *any* irgo silently kept
# it, so bumping IRGO_REPLACE upgraded nothing and builds ran against a stale
# CLI while looking fine.
# Not under ~/.irgo: that directory is the CLI's own state, and `irgo
# uninstall-tools` must be able to empty it completely. A maintainer stamp
# living there kept it alive and made a fully-uninstalled machine look
# provisioned.
STAMP="${XDG_CACHE_HOME:-$HOME/.cache}/irgo-demo/cli-tag"
INSTALLED="$(cat "$STAMP" 2>/dev/null || true)"
if ! command -v irgo >/dev/null 2>&1 || [ "$INSTALLED" != "$IRGO_FORK_TAG" ]; then
  [ -n "$INSTALLED" ] && [ "$INSTALLED" != "$IRGO_FORK_TAG" ] \
    && echo "irgo pin moved: $INSTALLED -> $IRGO_FORK_TAG (reinstalling)"
  if [ -d "$IRGO_FORK_DIR" ]; then
    echo "Installing irgo from fork checkout ($IRGO_FORK_DIR)..."
    (cd "$IRGO_FORK_DIR" && go install ./cmd/irgo) || go install github.com/stukennedy/irgo/cmd/irgo@v0.3.1
  elif command -v git >/dev/null 2>&1; then
    echo "irgo fork not found at $IRGO_FORK_DIR — cloning pinned tag $IRGO_FORK_TAG to build the CLI..."
    tmp="$(mktemp -d)"
    if git clone --quiet --depth 1 --branch "$IRGO_FORK_TAG" https://github.com/joeblew999/irgo "$tmp/irgo" && (cd "$tmp/irgo" && go install ./cmd/irgo); then
      rm -rf "$tmp"
    else
      echo "  ! fork clone/build failed — falling back to released CLI (v0.3.1)" >&2
      rm -rf "$tmp"
      go install github.com/stukennedy/irgo/cmd/irgo@v0.3.1
    fi
  else
    echo "irgo fork not found and git unavailable — installing released CLI (v0.3.1). Set IRGO_FORK_DIR to use the fork." >&2
    go install github.com/stukennedy/irgo/cmd/irgo@v0.3.1
  fi
  mkdir -p "$(dirname "$STAMP")" && echo "$IRGO_FORK_TAG" > "$STAMP"
fi
# Delegate tool installs to the CLI itself: `irgo install-tools` pins the
# templ generator to the project's go.mod version (no @latest drift) and
# installs air + gomobile.
IRGO_BIN="$(command -v irgo 2>/dev/null || true)"
if [ -z "$IRGO_BIN" ]; then
  IRGO_BIN="$(go env GOPATH 2>/dev/null || echo "$HOME/go")/bin/irgo"
fi
"$IRGO_BIN" install-tools
"""

# --- maintainer tasks --------------------------------------------------------
# These are for whoever maintains this demo against the fork, not for devs
# using irgo. A dev needs `irgo` and nothing here.

["cli:bump"]
description = "Bump the pinned irgo CLI: tag the fork, update IRGO_REPLACE, regenerate myapp, verify"
dir = "{{config_root}}"
run = """
set -e
TAG="{{arg(name="tag")}}"
[ -n "$TAG" ] || { echo "usage: mise run cli:bump <tag>" >&2; exit 1; }
FORK="${IRGO_FORK_DIR:-$HOME/workspace/go/src/github.com/joeblew999/irgo}"
[ -d "$FORK" ] || { echo "fork checkout not found at $FORK" >&2; exit 1; }

# 1. Tag and publish the fork. Refuse on a dirty tree: a tag that does not
#    match what was built is the whole problem this task exists to prevent.
if [ -n "$(git -C "$FORK" status --porcelain)" ]; then
  echo "fork has uncommitted changes — commit them before bumping" >&2
  git -C "$FORK" status --short >&2
  exit 1
fi
if ! git -C "$FORK" rev-parse "$TAG" >/dev/null 2>&1; then
  git -C "$FORK" tag "$TAG"
fi
git -C "$FORK" push -q origin "$(git -C "$FORK" branch --show-current)"
git -C "$FORK" push origin "$TAG"

# 2. Move the pin. Match the whole line rather than the old version: chaining
#    edits off an assumed previous value is how the pin silently stuck at .29
#    for six releases while every bump looked like it worked.
python3 - "$TAG" <<'PY'
import re, sys
tag = sys.argv[1]
p = 'mise.toml'
s = open(p).read()
new = f'IRGO_REPLACE = "github.com/joeblew999/irgo {tag}"'
s2, n = re.subn(r'IRGO_REPLACE = "[^"]*"', new, s)
if n != 1:
    raise SystemExit(f'expected exactly 1 IRGO_REPLACE line, found {n}')
open(p, 'w').write(s2)
print(f'  pin -> {tag}')
PY

# 3. Rebuild the CLI at the new pin, then regenerate the app from it.
mise run env:tools
mise run cli:regen

# 4. Prove the pin actually moved everywhere.
mise run cli:verify
echo
echo "Bumped to $TAG. Review and commit."
"""

["cli:regen"]
description = "Regenerate the app from the pinned CLI (this repo IS irgo new output)"
dir = "{{config_root}}"
run = """
set -e
# The repo root is the generated app, so regeneration writes in place rather
# than deleting a subdirectory. `irgo new .` overwrites the files it owns and
# leaves everything else — maintainer tooling, README, git history — alone.
irgo new .
# Files the template no longer ships (a Makefile, dev.sh) would otherwise
# linger forever, since writing in place cannot remove them. Delete the ones
# we know were dropped.
rm -f Makefile dev.sh
"""


["cli:verify"]
description = "Fail if the pinned CLI and myapp/go.mod disagree"
dir = "{{config_root}}"
run = "irgo doctor --strict"

["cli:local"]
description = "Install the irgo CLI from your local fork checkout (iterate on CLI or template changes)"
dir = "{{config_root}}"
run = """
set -e
FORK="${IRGO_FORK_DIR:-$HOME/workspace/go/src/github.com/joeblew999/irgo}"
[ -d "$FORK" ] || { echo "fork checkout not found at $FORK" >&2; exit 1; }
(cd "$FORK" && go install ./cmd/irgo)
echo "installed irgo from $FORK"
"""

["cli:iterate"]
description = "Rebuild the CLI from your local checkout, then regenerate myapp/ from it"
dir = "{{config_root}}"
depends = ["cli:local"]
run = "mise run cli:regen"
