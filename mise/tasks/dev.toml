# mise/tasks/dev.toml — irgo-demo day-to-day commands.
# mise auto-discovers .toml task files here (a default task dir), so no
# `[task_config] includes` is needed in mise.toml.
# All tasks run inside myapp/ where the project lives.
#
# Cross-platform: run `mise run env:setup` once per machine — it installs
# per-platform deps: brew (macOS), apt (Linux), MSYS2 pacman (Windows).
# Windows devs: these run scripts are POSIX shell — use Git Bash or MSYS2
# (not PowerShell/cmd).

["env:tools"]
description = "Install pinned Go tools (irgo/templ/air/gomobile) — versions match go.mod, idempotent"
dir = "{{config_root}}/myapp"
run = """
# Pinned to go.mod to avoid @latest drift: the irgo CLI must match the go.mod
# irgo version, and the templ generator must match the templ library version.
#
# irgo comes from the joeblew999/irgo fork (see go.mod `replace`). The fork
# keeps the upstream module path, so `go install github.com/joeblew999/irgo/...`
# would fail — build the CLI from a local checkout instead (set IRGO_FORK_DIR
# to point at one), falling back to the released CLI otherwise.
IRGO_FORK_DIR="${IRGO_FORK_DIR:-$HOME/workspace/go/src/github.com/joeblew999/irgo}"
if ! command -v irgo >/dev/null 2>&1; then
  if [ -d "$IRGO_FORK_DIR" ]; then
    echo "Installing irgo from fork ($IRGO_FORK_DIR)..."
    (cd "$IRGO_FORK_DIR" && go install ./cmd/irgo) || go install github.com/stukennedy/irgo/cmd/irgo@v0.3.1
  else
    echo "irgo fork not found at $IRGO_FORK_DIR — installing released CLI (v0.3.1). Set IRGO_FORK_DIR to use the fork." >&2
    go install github.com/stukennedy/irgo/cmd/irgo@v0.3.1
  fi
fi
for entry in \
  "templ|github.com/a-h/templ/cmd/templ@v0.3.977" \
  "air|github.com/air-verse/air@latest" \
  "gomobile|golang.org/x/mobile/cmd/gomobile@latest"; do
  name="${entry%%|*}"; pkg="${entry#*|}"
  if ! command -v "$name" >/dev/null 2>&1; then
    echo "Installing $name (go install)..."
    go install "$pkg" || echo "  ! failed to install $name"
  else
    echo "$name: already installed"
  fi
done
"""

["env:setup"]
description = "One-time: install all dev deps for this platform (Go tools + OS packages)"
depends = ["env:tools"]
dir = "{{config_root}}/myapp"
run = """
# OS-level packages, per platform (Go tools come from env:tools)
case "$(uname -s)" in
  Darwin)
    for pkg in entr mingw-w64; do
      if ! brew list --versions "$pkg" >/dev/null 2>&1; then
        echo "Installing $pkg via brew..."
        brew install "$pkg"
      fi
    done
    ;;
  Linux)
    # Debian/Ubuntu packages: entr (hot reload) + GTK3/WebKit2GTK 4.0
    # (desktop builds). Idempotent — skips if already installed.
    if command -v apt-get >/dev/null 2>&1; then
      if ! command -v entr >/dev/null 2>&1 || ! pkg-config --exists webkit2gtk-4.0 2>/dev/null; then
        echo "Installing OS packages via apt (entr, GTK3, WebKit2GTK 4.0)..."
        sudo apt-get update
        sudo apt-get install -y entr libgtk-3-dev libwebkit2gtk-4.0-dev
      else
        echo "Linux OS packages already installed"
      fi
    else
      echo "Linux: not apt-based — install entr, libgtk-3-dev, libwebkit2gtk-4.0-dev manually"
    fi
    ;;
  MINGW*|MSYS*|CYGWIN*)
    # MSYS2: install the mingw-w64 toolchain (C/C++ compiler for CGO desktop
    # builds). Idempotent (pacman --needed). Falls back to guidance otherwise.
    if command -v pacman >/dev/null 2>&1; then
      echo "Installing mingw-w64 toolchain via pacman..."
      pacman -S --noconfirm --needed mingw-w64-x86_64-gcc
    else
      echo "Windows: install MSYS2 (https://www.msys2.org) with the mingw-w64-x86_64 toolchain."
    fi
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    ;;
esac

# Initialize gomobile (no-op on macOS for iOS; needs Android NDK for android)
command -v gomobile >/dev/null 2>&1 && gomobile init || true
"""

["env:uninstall"]
description = "Remove everything 'env:setup' installs (Go tools + OS packages) — the exact inverse"
dir = "{{config_root}}/myapp"
run = """
gobin="$(go env GOBIN 2>/dev/null || echo "$(go env GOPATH)/bin")"
echo "Removing Go-installed tools from $gobin..."
for tool in irgo templ air gomobile gobind; do
  if [ -f "$gobin/$tool" ]; then
    echo "  removing $tool"
    rm -f "$gobin/$tool"
  fi
done

# Remove the temp x/mobile clone and local go.work created by irgo mobile builds
rm -rf "${TMPDIR:-/tmp}/golang-mobile" 2>/dev/null || true
rm -f go.work go.work.sum

case "$(uname -s)" in
  Darwin)
    echo "Removing brew packages (entr, mingw-w64)..."
    brew uninstall --formula mingw-w64 2>/dev/null || echo "  mingw-w64 not installed or already removed"
    brew uninstall --formula entr 2>/dev/null || echo "  entr not installed or already removed"
    brew autoremove 2>/dev/null || true
    ;;
  Linux)
    echo "Removing Linux OS packages (entr, GTK3, WebKit2GTK 4.0)..."
    sudo apt-get remove -y entr libgtk-3-dev libwebkit2gtk-4.0-dev 2>/dev/null || true
    ;;
  MINGW*|MSYS*|CYGWIN*)
    if command -v pacman >/dev/null 2>&1; then
      echo "Removing mingw-w64 toolchain via pacman..."
      pacman -R --noconfirm mingw-w64-x86_64-gcc 2>/dev/null || true
    else
      echo "Windows: remove MSYS2/mingw packages via pacman."
    fi
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    ;;
esac
"""

["env:setup:android"]
description = "Install Android SDK + NDK for Android builds (brew cask + sdkmanager) — idempotent"
dir = "{{config_root}}/myapp"
run = """
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"

# JDK required by sdkmanager + gradle. JDK 17 is pinned: the example's
# Gradle 8.2 / AGP 8.2 toolchain doesn't run on JDK 21+.
# Use the openjdk@17 FORMULA (not the temurin cask): the cask ships a .pkg
# installer that requires an admin password; the formula installs without.
# Note: macOS also ships a /usr/bin/java stub that `command -v java` finds
# but which has no runtime, so we test with `java -version`.
if ! java -version >/dev/null 2>&1 && [ "$(uname -s)" = "Darwin" ]; then
  if ! brew list --versions openjdk@17 >/dev/null 2>&1; then
    echo "Installing openjdk@17 via brew (required by sdkmanager + gradle)..."
    brew install openjdk@17
  fi
  export JAVA_HOME="$(brew --prefix openjdk@17)/libexec/openjdk.jdk/Contents/Home"
  export PATH="$JAVA_HOME/bin:$PATH"
  echo "JAVA_HOME=$JAVA_HOME"
fi

# Locate sdkmanager (brew cask path or PATH)
SDKM="$(command -v sdkmanager 2>/dev/null || true)"
for p in /opt/homebrew/share/android-commandlinetools/cmdline-tools/latest/bin/sdkmanager \
         /usr/local/share/android-commandlinetools/cmdline-tools/latest/bin/sdkmanager; do
  [ -z "$SDKM" ] && [ -x "$p" ] && SDKM="$p"
done

case "$(uname -s)" in
  Darwin)
    if [ -z "$SDKM" ] && ! brew list --cask android-commandlinetools >/dev/null 2>&1; then
      echo "Installing android-commandlinetools via brew..."
      brew install --cask android-commandlinetools
    fi
    ;;
  Linux|MINGW*|MSYS*|CYGWIN*)
    echo "Note: install Android cmdline-tools via your package manager or set ANDROID_HOME." >&2
    ;;
esac

# Re-locate after possible brew install
[ -z "$SDKM" ] && SDKM="$(command -v sdkmanager 2>/dev/null || true)"
[ -z "$SDKM" ] && [ -x /opt/homebrew/share/android-commandlinetools/cmdline-tools/latest/bin/sdkmanager ] && SDKM=/opt/homebrew/share/android-commandlinetools/cmdline-tools/latest/bin/sdkmanager

if [ -z "$SDKM" ]; then
  echo "sdkmanager not found — install android-commandlinetools (macOS) or set ANDROID_HOME." >&2
  exit 1
fi

# Install SDK components (sdkmanager is idempotent — skips what's installed)
mkdir -p "$ANDROID_HOME"
echo "Accepting Android SDK licenses..."
yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
echo "Installing Android SDK components (platform-tools, platform, build-tools, NDK)..."
"$SDKM" --sdk_root="$ANDROID_HOME" \
  "platform-tools" \
  "platforms;android-34" \
  "platforms;android-35" \
  "build-tools;35.0.0" \
  "ndk;26.3.11579264"
# Note: android-34 is needed by the example app (compileSdk 34); android-35
# is a fallback for gomobile bind's platform lookup.

# Pin the NDK explicitly. NDK r26 is required: gomobile defaults to API 16
# and NDK r27+ dropped support below API 21 ("unsupported API version 16").
export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
if [ -d "$ANDROID_NDK_HOME" ]; then
  echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
  command -v gomobile >/dev/null 2>&1 && gomobile init 2>&1 | tail -3 || true
else
  echo "NDK not found at $ANDROID_NDK_HOME — Android build may fail." >&2
fi
"""

["env:setup:emulator"]
description = "Install Android emulator + system image + create AVD (local dev only, for run:android)"
dir = "{{config_root}}/myapp"
run = """
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
SDKM="$(command -v sdkmanager 2>/dev/null || true)"
[ -z "$SDKM" ] && [ -x /opt/homebrew/share/android-commandlinetools/cmdline-tools/latest/bin/sdkmanager ] && SDKM=/opt/homebrew/share/android-commandlinetools/cmdline-tools/latest/bin/sdkmanager
if [ -z "$SDKM" ]; then
  echo "sdkmanager not found — run 'mise run env:setup:android' first" >&2
  exit 1
fi

# Install emulator + a system image (large download). Idempotent.
echo "Installing Android emulator + system image (large download)..."
"$SDKM" --sdk_root="$ANDROID_HOME" "emulator" "system-images;android-35;google_apis;arm64-v8a"

# Create the AVD if missing
AVDMGR="$(command -v avdmanager 2>/dev/null || true)"
[ -z "$AVDMGR" ] && [ -x /opt/homebrew/share/android-commandlinetools/cmdline-tools/latest/bin/avdmanager ] && AVDMGR=/opt/homebrew/share/android-commandlinetools/cmdline-tools/latest/bin/avdmanager
[ -z "$AVDMGR" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" ] && AVDMGR="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
if [ -n "$AVDMGR" ] && ! "$AVDMGR" list avd 2>/dev/null | grep -q "Name: irgo"; then
  echo "Creating AVD 'irgo'..."
  echo no | "$AVDMGR" create avd -n irgo -k "system-images;android-35;google_apis;arm64-v8a" --device "pixel_7" 2>/dev/null || true
fi
echo "Emulator ready — boot with: $ANDROID_HOME/emulator/emulator -avd irgo"
"""

["env:uninstall:android"]
description = "Remove everything env:setup:android installs (JDK, cmdline-tools, SDK)"
dir = "{{config_root}}/myapp"
run = """
case "$(uname -s)" in
  Darwin)
    echo "Removing openjdk@17 JDK (installed by env:setup:android)..."
    brew uninstall openjdk@17 2>/dev/null || echo "  openjdk@17 not installed or already removed"
    echo "Removing android-commandlinetools cask..."
    brew uninstall --cask android-commandlinetools 2>/dev/null || echo "  android-commandlinetools not installed or already removed"
    ;;
  Linux)
    echo "Linux: remove Android cmdline-tools via your package manager (or delete \\$ANDROID_HOME)."
    ;;
  MINGW*|MSYS*|CYGWIN*)
    echo "Windows: remove Android cmdline-tools via your package manager (or delete \\$ANDROID_HOME)."
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    ;;
esac

# Remove AVDs created by env:setup:emulator (stored outside the SDK)
echo "Removing AVDs..."
rm -rf "$HOME/.android/avd/irgo.avd" "$HOME/.android/avd/irgo.ini" 2>/dev/null || true

# Remove the SDK directory only if it's the one we manage (default location).
# Skip if ANDROID_HOME points somewhere custom — leave a dev's own SDK alone.
# The SDK dir contains platform-tools (adb), platforms, build-tools, the NDK,
# the emulator and system images — so this removes all of them at once.
sdk="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
if [ -n "$ANDROID_HOME" ] && [ "$sdk" != "$HOME/Library/Android/sdk" ]; then
  echo "ANDROID_HOME is custom ($sdk) — leaving it in place. Remove manually if desired."
else
  echo "Removing SDK directory (SDK, NDK, emulator, system images): $sdk"
  rm -rf "$sdk"
fi
"""

["serve:dev"]
description = "Start irgo dev server (hot reload) — requires entr (brew install entr)"
dir = "{{config_root}}/myapp"
run = "irgo dev"

["serve"]
description = "Run web server without file watching (no entr needed — pure mise)"
dir = "{{config_root}}/myapp"
run = "irgo serve"

["css"]
description = "Rebuild Tailwind CSS (input.css → output.css)"
dir = "{{config_root}}/myapp"
run = "bun run css"

["css:watch"]
description = "Watch Tailwind CSS sources"
dir = "{{config_root}}/myapp"
run = "bun run css:watch"

["build:templ"]
description = "Generate _templ.go from *.templ templates"
dir = "{{config_root}}/myapp"
run = "irgo templ"

["build:assets"]
description = "Generate templ + build Tailwind CSS (both gitignored but embedded — run before any build)"
depends = ["env:tools"]
dir = "{{config_root}}/myapp"
run = """
# git-bash drops the Windows Path var, so native children spawned by native
# tools (irgo -> templ/go) can't resolve executables. Re-export it in Windows
# format from the POSIX PATH. No-op on macOS/Linux.
case "$(uname -s)" in
  MINGW*|MSYS*|CYGWIN*) export Path="$(cygpath -w -p "$PATH")" ;;
esac
bun install
irgo templ
bun run css
"""

["diag:env"]
description = "Dump the environment a mise task actually sees (PATH/Path/tools) — used to debug Windows git-bash PATH issues"
run = """
echo "=== task PATH (POSIX) ==="; printf '%s\n' "$PATH" | tr ':' '\n' | head -12
echo "=== task Path (Windows) ==="; printf '%s\n' "$Path" | tr ';' '\n' | head -12
echo "=== cygpath -w -p result ==="; cygpath -w -p "$PATH" 2>&1 | head -c 300; echo
echo "=== tools (command -v) ==="; for t in go templ irgo air gomobile; do printf '%-8s ' "$t"; command -v "$t" 2>/dev/null || echo "MISSING"; done
echo "=== GOBIN ==="; echo "$GOBIN"; ls "$GOBIN" 2>/dev/null | head
echo "=== type -a go ==="; type -a go 2>&1 | head -3
"""

["check:test"]
description = "Run Go tests"
dir = "{{config_root}}/myapp"
run = "go test ./..."

["build:web"]
description = "Build web server binary"
dir = "{{config_root}}/myapp"
run = "go build -o build/myapp ."

["build:desktop"]
description = "Build desktop app for the current platform (auto-detects OS)"
dir = "{{config_root}}/myapp"
run = """
case "$(uname -s)" in
  Darwin)
    echo "Detected macOS — building macOS app"
    irgo build desktop darwin
    ;;
  Linux)
    echo "Detected Linux — building Linux app"
    irgo build desktop linux
    ;;
  MINGW*|MSYS*|CYGWIN*)
    echo "Detected Windows — building Windows app"
    irgo build desktop windows
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    exit 1
    ;;
esac
"""

["build:desktop:windows"]
description = "Build Windows desktop app (native on Windows; macOS cross-compiles via mingw-w64)"
dir = "{{config_root}}/myapp"
run = """
# git-bash drops the Windows Path var — native children (irgo -> go/templ)
# can't resolve executables without it. Re-export in Windows format; no-op
# on macOS/Linux.
case "$(uname -s)" in
  MINGW*|MSYS*|CYGWIN*) export Path="$(cygpath -w -p "$PATH")" ;;
esac
case "$(uname -s)" in
  Darwin)
    # macOS: brew provides the mingw-w64 cross-compiler.
    if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
      echo "Installing mingw-w64 via brew (Windows cross-compiler)..."
      brew install mingw-w64
    fi
    GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \\
      CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \\
      irgo build desktop windows
    ;;
  MINGW*|MSYS*|CYGWIN*)
    # Windows: build natively — mingw gcc is already on PATH (no CC override;
    # the x86_64-w64-mingw32- triple isn't guaranteed on the runner).
    echo "Detected Windows — building natively"
    GOOS=windows GOARCH=amd64 CGO_ENABLED=1 irgo build desktop windows
    ;;
  *)
    echo "Windows desktop build unsupported from $(uname -s)" >&2
    exit 1
    ;;
esac
"""

["build:desktop:linux"]
description = "Build Linux desktop app (native on Linux only — needs GTK/WebKit, not cross-compilable from macOS)"
dir = "{{config_root}}/myapp"
run = """
case "$(uname -s)" in
  Linux)
    echo "Detected Linux — building Linux app natively"
    irgo build desktop linux
    ;;
  *)
    echo "Linux desktop builds need GTK3 + WebKit2GTK and can't be cross-compiled from $(uname -s)." >&2
    echo "Build natively on a Linux machine/CI, or use a Docker image with:" >&2
    echo "  libgtk-3-dev libwebkit2gtk-4.0-dev golang" >&2
    exit 1
    ;;
esac
"""

["build:desktop:all"]
description = "Build all desktop apps the current environment supports (macOS → mac + windows)"
dir = "{{config_root}}/myapp"
run = """
case "$(uname -s)" in
  Darwin)
    echo "Detected macOS — building macOS + Windows apps"
    irgo build desktop darwin
    if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
      echo "Installing mingw-w64 via brew (Windows cross-compiler)..."
      brew install mingw-w64
    fi
    GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \
      CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
      irgo build desktop windows
    ;;
  Linux)
    echo "Detected Linux — building Linux app"
    irgo build desktop linux
    ;;
  MINGW*|MSYS*|CYGWIN*)
    echo "Detected Windows — building Windows app"
    irgo build desktop windows
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    exit 1
    ;;
esac
"""

["build:ios"]
description = "Build iOS framework (gomobile bind → build/ios/Irgo.xcframework) — requires Xcode"
dir = "{{config_root}}/myapp"
run = """
if ! command -v gomobile >/dev/null 2>&1; then
  echo "gomobile not found — run 'mise run env:setup' first"
  exit 1
fi
# Self-heal stale go.work: it references a temp x/mobile clone that macOS may
# have cleaned up. If so, remove it so irgo regenerates it (idempotent).
if [ -f go.work ]; then
  stale=0
  in_use=0
  while IFS= read -r line; do
    case "$line" in
      "use (") in_use=1 ;;
      ")") in_use=0 ;;
      "."|"") ;;
      *)
        if [ "$in_use" = "1" ]; then
          p=$(printf '%s' "$line" | tr -d '[:space:]')
          [ -d "$p" ] || { echo "go.work references missing dir: $p"; stale=1; }
        fi
        ;;
    esac
  done < go.work
  if [ "$stale" = "1" ]; then
    echo "Removing stale go.work (irgo regenerates it on next build)..."
    rm -f go.work go.work.sum
  fi
fi
irgo build ios
"""

