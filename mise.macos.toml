# macOS-specific mise config (merged with mise.toml).
#
# Deterministic Android env for local + CI. NDK r26 is pinned: gomobile
# defaults to API 16 and NDK r27+ dropped <21 ("unsupported API version 16").
# Overriding ambient CI env (which points at the runner's preinstalled NDK r27)
# is what keeps local and CI builds identical.

[env]
ANDROID_HOME = "{{env.HOME}}/Library/Android/sdk"
ANDROID_NDK_HOME = "{{env.HOME}}/Library/Android/sdk/ndk/26.3.11579264"
