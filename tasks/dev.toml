# tasks/dev.toml — irgo-demo day-to-day commands.
# All tasks run inside myapp/ where the project lives.
#
# Windows devs: these run scripts are POSIX shell — use Git Bash or MSYS2
# (not PowerShell/cmd), and install the mingw-w64 toolchain. `brew` is only
# used on macOS for the mingw-w64 cross-compiler.

["env:tools"]
description = "Install pinned Go tools (irgo/templ/air/gomobile) — versions match go.mod, idempotent"
dir = "{{config_root}}/myapp"
run = """
# Pinned to go.mod to avoid @latest drift: the irgo CLI must match the go.mod
# irgo version, and the templ generator must match the templ library version.
for entry in \
  "irgo|github.com/stukennedy/irgo/cmd/irgo@v0.3.1" \
  "templ|github.com/a-h/templ/cmd/templ@v0.3.977" \
  "air|github.com/air-verse/air@latest" \
  "gomobile|golang.org/x/mobile/cmd/gomobile@latest"; do
  name="${entry%%|*}"; pkg="${entry#*|}"
  if ! command -v "$name" >/dev/null 2>&1; then
    echo "Installing $name (go install)..."
    go install "$pkg" || echo "  ! failed to install $name"
  else
    echo "$name: already installed"
  fi
done
"""

["env:setup"]
description = "One-time: install all dev deps for this platform (Go tools + OS packages)"
depends = ["env:tools"]
dir = "{{config_root}}/myapp"
run = """
# OS-level packages, per platform (Go tools come from env:tools)
case "$(uname -s)" in
  Darwin)
    for pkg in entr mingw-w64; do
      if ! brew list --versions "$pkg" >/dev/null 2>&1; then
        echo "Installing $pkg via brew..."
        brew install "$pkg"
      fi
    done
    ;;
  Linux)
    echo "Linux: install OS packages with your package manager, e.g.:"
    echo "  sudo apt install entr libgtk-3-dev libwebkit2gtk-4.0-dev"
    ;;
  MINGW*|MSYS*|CYGWIN*)
    echo "Windows: use MSYS2 with the mingw-w64-x86_64 toolchain."
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    ;;
esac

# Initialize gomobile (no-op on macOS for iOS; needs Android NDK for android)
command -v gomobile >/dev/null 2>&1 && gomobile init || true
"""

["env:uninstall"]
description = "Remove everything 'env:setup' installs (Go tools + OS packages) — the exact inverse"
dir = "{{config_root}}/myapp"
run = """
gobin="$(go env GOBIN 2>/dev/null || echo "$(go env GOPATH)/bin")"
echo "Removing Go-installed tools from $gobin..."
for tool in irgo templ air gomobile gobind; do
  if [ -f "$gobin/$tool" ]; then
    echo "  removing $tool"
    rm -f "$gobin/$tool"
  fi
done

# Remove the temp x/mobile clone and local go.work created by irgo mobile builds
rm -rf "${TMPDIR:-/tmp}/golang-mobile" 2>/dev/null || true
rm -f go.work go.work.sum

case "$(uname -s)" in
  Darwin)
    echo "Removing brew packages (entr, mingw-w64)..."
    brew uninstall --formula mingw-w64 2>/dev/null || echo "  mingw-w64 not installed or already removed"
    brew uninstall --formula entr 2>/dev/null || echo "  entr not installed or already removed"
    brew autoremove 2>/dev/null || true
    ;;
  Linux)
    echo "Linux: remove OS packages with your package manager, e.g.:"
    echo "  sudo apt remove entr libgtk-3-dev libwebkit2gtk-4.0-dev"
    ;;
  MINGW*|MSYS*|CYGWIN*)
    echo "Windows: remove MSYS2/mingw packages via pacman."
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    ;;
esac
"""

["env:uninstall:android"]
description = "Remove the Android SDK + cmdline-tools installed for Android builds"
dir = "{{config_root}}/myapp"
run = """
case "$(uname -s)" in
  Darwin)
    echo "Removing android-commandlinetools cask..."
    brew uninstall --cask android-commandlinetools 2>/dev/null || echo "  android-commandlinetools not installed or already removed"
    ;;
  Linux)
    echo "Linux: remove Android cmdline-tools via your package manager (or delete \\$ANDROID_HOME)."
    ;;
  MINGW*|MSYS*|CYGWIN*)
    echo "Windows: remove Android cmdline-tools via your package manager (or delete \\$ANDROID_HOME)."
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    ;;
esac

# Remove the SDK directory only if it's the one we manage (default location).
# Skip if ANDROID_HOME points somewhere custom — leave a dev's own SDK alone.
sdk="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
if [ -n "$ANDROID_HOME" ] && [ "$sdk" != "$HOME/Library/Android/sdk" ]; then
  echo "ANDROID_HOME is custom ($sdk) — leaving it in place. Remove manually if desired."
else
  echo "Removing SDK directory: $sdk"
  rm -rf "$sdk"
fi
"""

["serve:dev"]
description = "Start irgo dev server (hot reload) — requires entr (brew install entr)"
dir = "{{config_root}}/myapp"
run = "irgo dev"

["serve"]
description = "Run web server without file watching (no entr needed — pure mise)"
dir = "{{config_root}}/myapp"
run = "irgo serve"

["css"]
description = "Rebuild Tailwind CSS (input.css → output.css)"
dir = "{{config_root}}/myapp"
run = "bun run css"

["css:watch"]
description = "Watch Tailwind CSS sources"
dir = "{{config_root}}/myapp"
run = "bun run css:watch"

["build:templ"]
description = "Generate _templ.go from *.templ templates"
dir = "{{config_root}}/myapp"
run = "irgo templ"

["build:assets"]
description = "Generate templ + build Tailwind CSS (both gitignored but embedded — run before any build)"
depends = ["env:tools"]
dir = "{{config_root}}/myapp"
run = """
bun install
irgo templ
bun run css
"""

["check:test"]
description = "Run Go tests"
dir = "{{config_root}}/myapp"
run = "go test ./..."

["build:web"]
description = "Build web server binary"
dir = "{{config_root}}/myapp"
run = "go build -o build/myapp ."

["build:desktop"]
description = "Build desktop app for the current platform (auto-detects OS)"
dir = "{{config_root}}/myapp"
run = """
case "$(uname -s)" in
  Darwin)
    echo "Detected macOS — building macOS app"
    irgo build desktop darwin
    ;;
  Linux)
    echo "Detected Linux — building Linux app"
    irgo build desktop linux
    ;;
  MINGW*|MSYS*|CYGWIN*)
    echo "Detected Windows — building Windows app"
    irgo build desktop windows
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    exit 1
    ;;
esac
"""

["build:desktop:windows"]
description = "Build Windows desktop app (macOS cross-compiles via mingw-w64; on Windows builds natively)"
dir = "{{config_root}}/myapp"
run = """
# On macOS: brew provides the mingw-w64 cross-compiler.
# On Windows: native mingw/MSYS2 already ships x86_64-w64-mingw32-gcc — no brew.
if [ "$(uname -s)" = "Darwin" ] && ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
  echo "Installing mingw-w64 via brew (Windows cross-compiler)..."
  brew install mingw-w64
fi
GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \
  CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
  irgo build desktop windows
"""

["build:desktop:linux"]
description = "Build Linux desktop app (native on Linux only — needs GTK/WebKit, not cross-compilable from macOS)"
dir = "{{config_root}}/myapp"
run = """
case "$(uname -s)" in
  Linux)
    echo "Detected Linux — building Linux app natively"
    irgo build desktop linux
    ;;
  *)
    echo "Linux desktop builds need GTK3 + WebKit2GTK and can't be cross-compiled from $(uname -s)." >&2
    echo "Build natively on a Linux machine/CI, or use a Docker image with:" >&2
    echo "  libgtk-3-dev libwebkit2gtk-4.0-dev golang" >&2
    exit 1
    ;;
esac
"""

["build:desktop:all"]
description = "Build all desktop apps the current environment supports (macOS → mac + windows)"
dir = "{{config_root}}/myapp"
run = """
case "$(uname -s)" in
  Darwin)
    echo "Detected macOS — building macOS + Windows apps"
    irgo build desktop darwin
    if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
      echo "Installing mingw-w64 via brew (Windows cross-compiler)..."
      brew install mingw-w64
    fi
    GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \
      CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
      irgo build desktop windows
    ;;
  Linux)
    echo "Detected Linux — building Linux app"
    irgo build desktop linux
    ;;
  MINGW*|MSYS*|CYGWIN*)
    echo "Detected Windows — building Windows app"
    irgo build desktop windows
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    exit 1
    ;;
esac
"""

["build:ios"]
description = "Build iOS framework (gomobile bind → build/ios/Irgo.xcframework) — requires Xcode"
dir = "{{config_root}}/myapp"
run = """
if ! command -v gomobile >/dev/null 2>&1; then
  echo "gomobile not found — run 'mise run env:setup' first"
  exit 1
fi
# Self-heal stale go.work: it references a temp x/mobile clone that macOS may
# have cleaned up. If so, remove it so irgo regenerates it (idempotent).
if [ -f go.work ]; then
  stale=0
  in_use=0
  while IFS= read -r line; do
    case "$line" in
      "use (") in_use=1 ;;
      ")") in_use=0 ;;
      "."|"") ;;
      *)
        if [ "$in_use" = "1" ]; then
          p=$(printf '%s' "$line" | tr -d '[:space:]')
          [ -d "$p" ] || { echo "go.work references missing dir: $p"; stale=1; }
        fi
        ;;
    esac
  done < go.work
  if [ "$stale" = "1" ]; then
    echo "Removing stale go.work (irgo regenerates it on next build)..."
    rm -f go.work go.work.sum
  fi
fi
irgo build ios
"""

["build:ios:sim"]
description = "Build iOS app for simulator, Debug config (framework + xcodebuild)"
dir = "{{config_root}}/myapp"
run = """
if ! command -v gomobile >/dev/null 2>&1; then
  echo "gomobile not found — run 'mise run env:setup' first"
  exit 1
fi
# Self-heal stale go.work (see build:ios)
if [ -f go.work ]; then
  stale=0
  in_use=0
  while IFS= read -r line; do
    case "$line" in
      "use (") in_use=1 ;;
      ")") in_use=0 ;;
      "."|"") ;;
      *)
        if [ "$in_use" = "1" ]; then
          p=$(printf '%s' "$line" | tr -d '[:space:]')
          [ -d "$p" ] || { echo "go.work references missing dir: $p"; stale=1; }
        fi
        ;;
    esac
  done < go.work
  if [ "$stale" = "1" ]; then
    echo "Removing stale go.work (irgo regenerates it on next build)..."
    rm -f go.work go.work.sum
  fi
fi
irgo build ios
xcodebuild -project ios/Example/Example.xcodeproj -scheme Example \
  -destination 'generic/platform=iOS Simulator' \
  -derivedDataPath build/ios/DerivedData build
"""

["run:ios"]
description = "Build + launch iOS app on Simulator (prod-style: embedded Go, no dev server)"
dir = "{{config_root}}/myapp"
