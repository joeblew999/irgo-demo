# irgo package configuration — defaults for `irgo package <ios|android|windows>`
#
# Override any of these per invocation with CLI flags, e.g.:
#   irgo package ios     --team AB12CD3EFG
#   irgo package android --keystore ~/keys/release.keystore --version 1.2.3
#   irgo package windows --publisher "CN=My Company, O=My Company"
#
# Android signing falls back to the debug keystore (~/.android/debug.keystore,
# pass "android") when keystore is empty — fine for validation, NOT for the
# Play Store.

[common]
version = "0.1.0"

[ios]
team = ""
export_method = "app-store"

[android]
keystore = ""
keystore_pass = ""
key_alias = ""
key_pass = ""

[windows]
publisher = ""
cert = ""
cert_pass = ""
icon = ""

[macos]
# Developer ID Application certificate (e.g. "Developer ID Application: Your Name (TEAMID)")
identity = ""
# Notarization (requires Apple ID + team + app-specific password)
notarize = false
apple_id = ""
team = ""
password = ""
# Also produce a .dmg
dmg = false
