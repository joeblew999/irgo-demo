# mise.toml — irgo-demo
# Go toolchain for this repo (irgo requires Go 1.21+)
# node for Tailwind CLI + frontend tooling, bun for the CSS build
#
# Tasks live in mise/tasks/*.toml (a mise default task dir — auto-discovered).
# Go-installed tools (irgo, templ, air, gomobile) and OS packages (entr,
# mingw-w64, Xcode) are NOT managed by mise — run `mise run env:setup` once.

[tools]
go = "1.26.5"
node = "lts"
bun = "latest"

# Deterministic Android env for local + CI (mise sets these for every task).
# NDK r26 is pinned: gomobile defaults to API 16 and NDK r27+ dropped <21
# ("unsupported API version 16"). Overriding ambient CI env (which points at
# the runner's preinstalled NDK r27) is what keeps builds identical.
[env]
ANDROID_HOME = "{{env.HOME}}/Library/Android/sdk"
ANDROID_NDK_HOME = "{{env.HOME}}/Library/Android/sdk/ndk/26.3.11579264"
