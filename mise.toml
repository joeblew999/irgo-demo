# mise.toml — irgo-demo (MAINTAINER TOOLING).
#
# Developers using irgo do not need mise. This exists so this demo repo can
# pin, install and verify the fork CLI it is generated from.
# Go toolchain for this repo (irgo requires Go 1.21+)
# node for Tailwind CLI + frontend tooling, bun for the CSS build
#
# Tasks live in mise/tasks/*.toml (a mise default task dir — auto-discovered).
# Go-installed tools (irgo, templ, air, gomobile) and OS packages (entr,
# mingw-w64, Xcode) are NOT managed by mise — run `mise run env:setup` once.

[tools]
go = "1.26.5"
node = "lts"
bun = "latest"

# The single pin that keeps the CLI and this repo lined up. Both sides read it:
#   - `irgo new myapp` writes it into myapp/go.mod as the replace directive
#   - `env:tools` builds that exact CLI version
# It lives here, not in myapp/go.mod, because myapp/ is CLI *output* — it is
# regenerated wholesale by `irgo new`, which would destroy a pin kept inside it.
#
# The fork keeps the upstream module path (so the replace is transparent), which
# is also why the CLI is built from a checkout rather than `go install`ed.
[env]
IRGO_REPLACE = "github.com/joeblew999/irgo v0.4.0-androidapi21.47"

# Fetch the fork straight from GitHub: skip proxy.golang.org and sum.golang.org
# for it. Those index a newly pushed tag on their own schedule (minutes to
# tens of minutes), and until they do, every build — including gomobile's
# internal `go mod tidy` — fails with "unknown revision". Nothing about a fork
# pin needs a public mirror or checksum attestation, so don't wait on one.
# GOPRIVATE sets both GONOPROXY and GONOSUMDB.
GOPRIVATE = "github.com/joeblew999/*"

# All shell tasks are POSIX scripts — force bash on every OS. mise defaults to
# `sh -c` on Unix but `cmd /c` on Windows, where our `#` comments/`for` loops
# break ('#' is not recognized...). Bash ships on GitHub Windows runners
# (Git Bash) and is the default on macOS/Linux.
[task_config]
shell = "bash -c"

# Android env vars are per-platform — see mise.macos.toml, mise.linux.toml,
# mise.windows.toml. The SDK path and the home-dir env var differ by OS (HOME
# on macOS/Linux, LOCALAPPDATA on Windows), and a template like {{env.HOME}}
# fails to parse on Windows runners (no HOME there), breaking mise entirely.

